<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Elastic vs Plastic: 9th Grade Physics</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #222; }
        
        /* The Control Panel */
        #ui-panel {
            position: absolute;
            top: 20px; left: 20px;
            width: 300px;
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            color: #333;
        }

        h2 { margin-top: 0; font-size: 1.2rem; color: #444; border-bottom: 2px solid #ddd; padding-bottom: 10px;}
        
        .control-group { margin-bottom: 20px; }
        
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        
        /* Making the slider look nice */
        input[type=range] {
            width: 100%;
            cursor: pointer;
        }

        .status { font-size: 0.9rem; margin-top: 5px; color: #666; }
        .force-val { color: #d00; font-weight: bold; }

        button {
            width: 100%;
            padding: 10px;
            background: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }
        button:hover { background: #555; }

        /* Floating labels above 3D objects */
        .world-label {
            position: absolute;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 5px 10px;
            border-radius: 4px;
            pointer-events: none;
            font-size: 0.9rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="ui-panel">
    <h2>🧪 Material Science Lab</h2>
    
    <div class="control-group">
        <label>Apply Pulling Force (Stress)</label>
        <input type="range" id="forceSlider" min="0" max="1.5" step="0.01" value="0">
        <div class="status">Force: <span id="forceDisplay" class="force-val">0.00</span> N</div>
    </div>

    <div style="font-size: 0.85rem; line-height: 1.4; margin-bottom: 15px; background: #f0f0f0; padding: 10px; border-radius: 5px;">
        <strong>Look closely:</strong><br>
        Notice how the bars get <em>thinner</em> as they get longer? That is real physics!
    </div>

    <button onclick="resetExperiment()">🔄 Reset Experiment</button>
</div>

<div id="label-elastic" class="world-label">Elastic (Rubber)</div>
<div id="label-plastic" class="world-label">Plastic (Gum)</div>

<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // 1. SCENE SETUP
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xa0a0a0);
    scene.fog = new THREE.Fog(0xa0a0a0, 10, 50); // Adds depth

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 5, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true; // Enable shadows for realism
    document.body.appendChild(renderer.domElement);

    // 2. LIGHTING (Make it look real)
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444);
    hemiLight.position.set(0, 20, 0);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 2);
    dirLight.position.set(5, 10, 7);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    scene.add(dirLight);

    // 3. THE FLOOR (Grounding the physics)
    const mesh = new THREE.Mesh( new THREE.PlaneGeometry(100, 100), new THREE.MeshPhongMaterial({ color: 0x999999, depthWrite: false }));
    mesh.rotation.x = - Math.PI / 2;
    mesh.receiveShadow = true;
    scene.add(mesh);
    
    // Grid helper
    const grid = new THREE.GridHelper(100, 100, 0x000000, 0x000000);
    grid.material.opacity = 0.2;
    grid.material.transparent = true;
    scene.add(grid);

    // 4. THE MATERIALS (The Bars)
    // Geometry logic: We move the pivot point to the BOTTOM of the cylinder so it grows upwards
    const geometry = new THREE.CylinderGeometry(0.5, 0.5, 1, 32);
    geometry.translate(0, 0.5, 0); // Shift geometry so y=0 is the bottom

    // Elastic Bar (Blue)
    const elasticMat = new THREE.MeshStandardMaterial({ color: 0x2266cc, roughness: 0.4, metalness: 0.2 });
    const elasticBar = new THREE.Mesh(geometry, elasticMat);
    elasticBar.position.set(-2, 0, 0);
    elasticBar.castShadow = true;
    scene.add(elasticBar);

    // Plastic Bar (Red)
    const plasticMat = new THREE.MeshStandardMaterial({ color: 0xdd3333, roughness: 0.4, metalness: 0.2 });
    const plasticBar = new THREE.Mesh(geometry, plasticMat);
    plasticBar.position.set(2, 0, 0);
    plasticBar.castShadow = true;
    scene.add(plasticBar);

    // 5. CONTROLS & LOGIC
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 2, 0);

    const slider = document.getElementById('forceSlider');
    const display = document.getElementById('forceDisplay');
    const labelElastic = document.getElementById('label-elastic');
    const labelPlastic = document.getElementById('label-plastic');

    // Variables for physics state
    let maxPlasticDeformation = 1.0; // Starts at scale 1.0

    function animate() {
        requestAnimationFrame(animate);
        controls.update();

        // --- THE PHYSICS ENGINE ---
        
        // 1. Get the Force (Stress)
        const force = parseFloat(slider.value);
        display.innerText = (force * 100).toFixed(0); // Display as realistic Newtons

        // Calculate Stretch (Strain)
        const targetScale = 1 + force; // If force is 0, scale is 1. If force is 1, scale is 2.

        // --- ELASTIC BEHAVIOR (Blue) ---
        // It simply follows the slider.
        elasticBar.scale.y = targetScale;
        
        // REALISM: Poisson Effect (Conservation of Volume)
        // As it gets taller (y), it must get thinner (x and z).
        // Formula: NewWidth = 1 / sqrt(NewHeight)
        const thinning = 1 / Math.sqrt(elasticBar.scale.y);
        elasticBar.scale.x = thinning;
        elasticBar.scale.z = thinning;

        // --- PLASTIC BEHAVIOR (Red) ---
        // It only grows if we pull harder than before. It never shrinks.
        if (targetScale > maxPlasticDeformation) {
            maxPlasticDeformation = targetScale;
        }
        plasticBar.scale.y = maxPlasticDeformation;
        
        // Plastic Thinning (remains thin permanently)
        const plasticThinning = 1 / Math.sqrt(maxPlasticDeformation);
        plasticBar.scale.x = plasticThinning;
        plasticBar.scale.z = plasticThinning;

        // --- UPDATE LABELS POSITIONS ---
        updateLabel(elasticBar, labelElastic);
        updateLabel(plasticBar, labelPlastic);

        renderer.render(scene, camera);
    }

    // Helper to keep text floating above the bars
    function updateLabel(mesh, div) {
        const tempV = new THREE.Vector3();
        // Get the top center of the bar
        tempV.setFromMatrixPosition(mesh.matrixWorld);
        tempV.y += mesh.scale.y + 0.5; 

        // Project to 2D screen space
        tempV.project(camera);
        const x = (tempV.x * .5 + .5) * window.innerWidth;
        const y = (-(tempV.y * .5) + .5) * window.innerHeight;

        div.style.transform = `translate(-50%, -50%) translate(${x}px,${y}px)`;
    }

    // Handle Window Resize
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Reset Button Logic
    window.resetExperiment = () => {
        // Animate slider back to 0
        slider.value = 0;
        maxPlasticDeformation = 1.0;
    };

    animate();
</script>
</body>
</html>

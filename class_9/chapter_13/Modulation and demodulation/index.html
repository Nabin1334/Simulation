<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modulation & Demodulation Simulation</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #1a1a1a;
        color: #f0f0f0;
        margin: 0;
        padding: 20px;
      }

      h1 {
        margin-bottom: 10px;
        color: #4facfe;
        text-align: center;
      }
      p {
        color: #aaa;
        margin-bottom: 20px;
        font-size: 0.9rem;
        text-align: center;
      }

      .main-layout {
        display: flex;
        flex-direction: row;
        align-items: flex-start;
        justify-content: center;
        gap: 40px;
        width: 100%;
        max-width: 1400px;
        margin: 0 auto;
      }

      .left-panel {
        display: flex;
        flex-direction: column;
        gap: 20px;
        min-width: 270px;
        flex-shrink: 0;
      }

      .dashboard {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-bottom: 0;
        flex-wrap: nowrap;
        justify-content: flex-start;
      }

      .control-panel {
        background: #2d2d2d;
        padding: 15px;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        border-left: 4px solid #4facfe;
        min-width: 250px;
      }
      .control-panel:last-child {
        border-left-color: #ff0055;
      }

      .control-panel h3 {
        margin-top: 0;
        font-size: 1rem;
        color: #fff;
      }

      .slider-group {
        margin-bottom: 10px;
      }
      label {
        display: flex;
        justify-content: space-between;
        font-size: 0.85rem;
        margin-bottom: 5px;
      }
      input[type="range"] {
        width: 100%;
        cursor: pointer;
      }

      .right-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        flex: 1;
        min-width: 0;
      }

      canvas {
        background: #000;
        border-radius: 8px;
        box-shadow: 0 0 20px rgba(79, 172, 254, 0.2);
        border: 1px solid #333;
        max-width: 100%;
      }

      .legend {
        display: flex;
        gap: 15px;
        margin-top: 10px;
        font-size: 0.8rem;
        flex-wrap: wrap;
        justify-content: center;
      }
      .dot {
        width: 10px;
        height: 10px;
        display: inline-block;
        border-radius: 50%;
        margin-right: 5px;
      }
    </style>
  </head>
  <body>
    <h1>Modulation & Demodulation</h1>
    <p>Visualizing the journey from Voice to Radio Wave and back to Sound</p>

    <div class="main-layout">
      <div class="left-panel">
        <div class="dashboard">
          <div class="control-panel">
            <h3>🎤 Input Source (Message)</h3>
            <div class="slider-group">
              <label
                >Audio Frequency (Pitch) <span id="freqVal">Low</span></label
              >
              <input
                type="range"
                id="audioFreq"
                min="1"
                max="5"
                step="0.1"
                value="2"
              />
            </div>
            <div class="slider-group">
              <label
                >Audio Amplitude (Volume) <span id="ampVal">Med</span></label
              >
              <input type="range" id="audioAmp" min="10" max="40" value="25" />
            </div>
          </div>

          <div class="control-panel">
            <h3>📡 Carrier Wave</h3>
            <div class="slider-group">
              <label>Carrier Frequency (Hz)</label>
              <input
                type="range"
                id="carrierFreq"
                min="10"
                max="30"
                step="1"
                value="15"
              />
            </div>
          </div>
        </div>
      </div>
      <div class="right-panel">
        <canvas id="simCanvas" width="1000" height="500"></canvas>
        <div class="legend">
          <span
            ><span class="dot" style="background: #00ff00"></span>Message Signal
            (Audio)</span
          >
          <span
            ><span class="dot" style="background: #ff0055"></span>Carrier
            Signal</span
          >
          <span
            ><span class="dot" style="background: #4facfe"></span>Modulated
            Wave</span
          >
          <span
            ><span class="dot" style="background: #ffff00"></span>Demodulated
            Output</span
          >
        </div>
      </div>
    </div>

    <script src="index.js">
      
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Multi-Planet Gravity Simulator</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #000; 
            font-family: 'Segoe UI', sans-serif; 
        }
        
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            width: auto;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            pointer-events: none; /* Let clicks pass through to 3D scene where not on buttons */
        }

        .hud-panel {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 25px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: left;
            color: white;
            pointer-events: auto;
            backdrop-filter: blur(5px);
            margin-bottom: 15px;
        }

        h1 { 
            margin: 0 0 10px 0; 
            font-size: 1.5rem; 
            letter-spacing: 1px; 
            text-transform: uppercase; 
        }
        
        .data-display { 
            font-size: 1.1rem; 
            color: #aaa; 
            margin-bottom: 15px; 
        }
        
        .highlight { 
            color: #44aaff; 
            font-weight: bold; 
        }

        .planet-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-start;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 18px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            transition: transform 0.1s, opacity 0.2s;
            text-transform: uppercase;
        }
        
        button:hover { 
            transform: scale(1.05); 
            opacity: 0.9; 
        }
        
        button:active { 
            transform: scale(0.95); 
        }

        /* Specific Colors for buttons */
        .btn-earth { 
            background: #22aaff; 
            color: white; 
        }
        
        .btn-moon { 
            background: #888888; 
            color: white; 
        }
        
        .btn-mars { 
            background: #ff4400; 
            color: white; 
        }
        
        .btn-jupiter { 
            background: #d4a35f; 
            color: black; 
        }
        
        .btn-pluto { 
            background: #aaddff; 
            color: black; 
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            #ui-container {
                top: 15px;
                left: 15px;
            }
            
            .hud-panel {
                padding: 12px 20px;
            }
            
            h1 { 
                font-size: 1.3rem; 
            }
            
            .data-display { 
                font-size: 1rem; 
            }
            
            button {
                padding: 8px 14px;
                font-size: 13px;
            }
        }

        @media (max-width: 768px) {
            #ui-container {
                top: 10px;
                left: 10px;
                right: 10px;
                width: calc(100% - 20px);
            }
            
            .hud-panel {
                padding: 10px 15px;
                width: 100%;
                max-width: 100%;
            }
            
            h1 { 
                font-size: 1.1rem; 
                margin: 0 0 8px 0;
            }
            
            .data-display { 
                font-size: 0.9rem; 
                margin-bottom: 12px;
            }
            
            .planet-buttons {
                gap: 8px;
            }
            
            button {
                padding: 8px 12px;
                font-size: 12px;
                flex: 1 1 calc(50% - 4px);
                min-width: calc(50% - 4px);
            }
        }

        @media (max-width: 480px) {
            #ui-container {
                top: 5px;
                left: 5px;
                right: 5px;
                width: calc(100% - 10px);
            }
            
            .hud-panel {
                padding: 8px 12px;
                border-radius: 8px;
            }
            
            h1 { 
                font-size: 1rem; 
                letter-spacing: 0.5px;
            }
            
            .data-display { 
                font-size: 0.85rem; 
                margin-bottom: 10px;
            }
            
            .planet-buttons {
                gap: 6px;
            }
            
            button {
                padding: 7px 10px;
                font-size: 11px;
                flex: 1 1 calc(50% - 3px);
                min-width: calc(50% - 3px);
            }
        }

        /* Landscape orientation for mobile */
        @media (max-width: 768px) and (orientation: landscape) {
            #ui-container {
                top: 5px;
                left: 5px;
            }
            
            .hud-panel {
                padding: 8px 12px;
            }
            
            h1 { 
                font-size: 0.95rem; 
            }
            
            .data-display { 
                font-size: 0.8rem; 
            }
            
            button {
                padding: 6px 10px;
                font-size: 10px;
            }
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <div class="hud-panel">
            <h1 id="planet-name">EARTH</h1>
            <div class="data-display">Gravity: <span id="gravity-val" class="highlight">9.81</span> m/s²</div>
            
            <div class="planet-buttons">
                <button class="btn-moon" onclick="setSystem('MOON')">Moon</button>
                <button class="btn-mars" onclick="setSystem('MARS')">Mars</button>
                <button class="btn-earth" onclick="setSystem('EARTH')">Earth</button>
                <button class="btn-jupiter" onclick="setSystem('JUPITER')">Jupiter</button>
                <button class="btn-pluto" onclick="setSystem('PLUTO')">Pluto</button>
            </div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module" src="index.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Lightning Simulation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.min.js"></script>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
      }

      canvas {
        display: block;
      }

      #controls {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(0, 0, 0, 0.8);
        padding: 20px;
        border-radius: 10px;
        color: white;
        font-family: Arial, sans-serif;
        max-width: 320px;
        backdrop-filter: blur(5px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      h2 {
        margin-top: 0;
        color: #4fc3f7;
        margin-bottom: 20px;
        text-shadow: 0 0 10px rgba(79, 195, 247, 0.5);
      }

      .control-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #ccc;
        font-size: 14px;
      }

      input[type="range"] {
        width: 100%;
        height: 6px;
        background: #333;
        border-radius: 3px;
        outline: none;
        -webkit-appearance: none;
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 20px;
        height: 20px;
        background: #4fc3f7;
        border-radius: 50%;
        cursor: pointer;
        box-shadow: 0 0 10px rgba(79, 195, 247, 0.8);
      }

      button {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #4fc3f7, #2196f3);
        border: none;
        border-radius: 6px;
        color: white;
        cursor: pointer;
        font-size: 16px;
        margin-top: 5px;
        font-weight: bold;
        transition: all 0.3s;
      }

      button:hover {
        background: linear-gradient(135deg, #29b6f6, #1976d2);
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(79, 195, 247, 0.4);
      }

      button:active {
        transform: translateY(0);
      }

      #stats {
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid rgba(255, 255, 255, 0.2);
      }

      .stat {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
        font-size: 14px;
        align-items: center;
      }

      .stat-value {
        color: #4fc3f7;
        font-weight: bold;
        font-size: 16px;
      }

      .instructions {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.8);
        padding: 10px 20px;
        border-radius: 8px;
        color: #ccc;
        font-size: 14px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(5px);
      }

      .audio-controls {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }

      .audio-btn {
        flex: 1;
        padding: 8px;
        font-size: 14px;
        background: rgba(79, 195, 247, 0.2);
        border: 1px solid rgba(79, 195, 247, 0.3);
      }

      .audio-btn.active {
        background: #4fc3f7;
        color: #000;
      }
    </style>
  </head>
  <body>
    <div id="controls">
      <h2>⚡ Lightning </h2>

      <div class="control-group">
        <label for="flashRate"
          >Flash Rate: <span id="flashRateValue">2.0</span>/s</label
        >
        <input
          type="range"
          id="flashRate"
          min="0.1"
          max="5"
          step="0.1"
          value="2.0"
        />
      </div>

      <div class="control-group">
        <label for="intensity"
          >Intensity: <span id="intensityValue">8.0</span></label
        >
        <input
          type="range"
          id="intensity"
          min="1"
          max="15"
          step="0.5"
          value="8.0"
        />
      </div>

      <div class="control-group">
        <label for="branches"
          >Branches: <span id="branchesValue">5</span></label
        >
        <input type="range" id="branches" min="0" max="15" step="1" value="5" />
      </div>

      <button id="strikeButton">⚡ Strike Now!</button>
      <button id="megaStrike">💥 Mega Strike!</button>

      <div class="audio-controls">
        <button id="audioBtn" class="audio-btn active">🔊 Sound On</button>
        <button id="volumeBtn" class="audio-btn">🔈 Low</button>
      </div>

      <div id="stats">
        <div class="stat">
          <span>Total Strikes:</span>
          <span class="stat-value" id="strikeCount">0</span>
        </div>
        <div class="stat">
          <span>Temperature:</span>
          <span class="stat-value" id="temperature">30,000°C</span>
        </div>
        <div class="stat">
          <span>Voltage:</span>
          <span class="stat-value" id="voltage">1 Billion V</span>
        </div>
        <div class="stat">
          <span>Current Flash:</span>
          <span class="stat-value" id="currentFlash">None</span>
        </div>
      </div>
    </div>

    <div class="instructions">
      Drag to rotate • Scroll to zoom • Right-click to pan
    </div>

    <script src="index.js">
   
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Static Electricity - Real Physics Simulation</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #1a237e 0%, #311b92 100%);
        overflow: hidden;
        height: 100vh;
        color: white;
      }

      /* Main Title */
      #mainTitle {
        position: absolute;
        top: 15px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(10px);
        border: 2px solid rgba(255, 255, 255, 0.1);
        padding: 15px 40px;
        border-radius: 15px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        text-align: center;
        z-index: 1000;
      }

      #mainTitle h1 {
        font-size: 28px;
        color: #ffeb3b;
        margin-bottom: 5px;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
      }

      #mainTitle p {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.8);
      }

      /* Instructions Panel */
      #instructionsPanel {
        position: absolute;
        top: 110px;
        left: 20px;
        width: 320px;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(10px);
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-radius: 15px;
        padding: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        z-index: 1000;
      }

      #instructionsPanel h2 {
        color: #ffeb3b;
        font-size: 20px;
        margin-bottom: 20px;
        text-align: center;
        border-bottom: 2px solid #ffeb3b;
        padding-bottom: 10px;
      }

      .instruction-step {
        display: flex;
        align-items: center;
        margin: 15px 0;
        padding: 12px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
        transition: all 0.3s ease;
        cursor: pointer;
        border: 1px solid transparent;
      }

      .instruction-step:hover {
        transform: translateX(8px);
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 235, 59, 0.3);
      }

      .instruction-step.active {
        background: rgba(255, 235, 59, 0.15);
        border-color: rgba(255, 235, 59, 0.5);
        box-shadow: 0 0 15px rgba(255, 235, 59, 0.3);
      }

      .instruction-step.active .step-icon {
        background: #ffeb3b;
        color: #000;
        box-shadow: 0 0 10px rgba(255, 235, 59, 0.8);
      }

      .step-icon {
        width: 35px;
        height: 35px;
        background: rgba(255, 255, 255, 0.1);
        color: #ffeb3b;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 16px;
        margin-right: 15px;
        flex-shrink: 0;
        transition: all 0.3s ease;
      }

      .step-text {
        font-size: 14px;
        color: white;
        line-height: 1.4;
      }

      /* Status Panel */
      #statusPanel {
        position: absolute;
        top: 110px;
        right: 20px;
        width: 280px;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(10px);
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-radius: 15px;
        padding: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        z-index: 1000;
      }

      #statusPanel h2 {
        color: #ffeb3b;
        font-size: 20px;
        margin-bottom: 20px;
        text-align: center;
        border-bottom: 2px solid #ffeb3b;
        padding-bottom: 10px;
      }

      .status-row {
        margin: 12px 0;
        padding: 10px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 8px;
        border-left: 4px solid #ffeb3b;
      }

      .status-label {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.7);
        margin-bottom: 5px;
      }

      .status-value {
        font-size: 16px;
        font-weight: bold;
        color: white;
      }

      /* Charge Meter */
      .charge-meter {
        width: 100%;
        height: 20px;
        background: linear-gradient(to right, #2196f3, #9c27b0, #f44336);
        border-radius: 10px;
        position: relative;
        margin-top: 8px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .charge-indicator {
        position: absolute;
        width: 8px;
        height: 100%;
        background: white;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        transition: left 0.3s ease;
        border-radius: 2px;
      }

      /* Paper Counter */
      #paperCounter {
        position: absolute;
        bottom: 40px; /* moved further down */
        right: 20px;
        width: 200px;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(10px);
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-radius: 15px;
        padding: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        text-align: center;
        z-index: 1000;
      }

      #paperCounter h3 {
        color: rgba(255, 255, 255, 0.8);
        font-size: 14px;
        margin-bottom: 10px;
      }

      .counter-display {
        font-size: 48px;
        font-weight: bold;
        color: #4caf50;
        text-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
      }

      #paperCounter p {
        color: rgba(255, 255, 255, 0.7);
        font-size: 14px;
        margin-top: 5px;
      }

      /* Control Buttons */
      #controlPanel {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 20px;
        z-index: 1000;
      }

      .control-btn {
        padding: 12px 30px;
        font-size: 15px;
        font-weight: bold;
        border: none;
        border-radius: 25px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        color: white;
        background: linear-gradient(135deg, #2196f3 0%, #21cbf3 100%);
      }

      .control-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 20px rgba(33, 150, 243, 0.4);
      }

      .control-btn:active {
        transform: translateY(-1px);
      }

      #resetButton {
        background: linear-gradient(135deg, #f44336 0%, #ff9800 100%);
      }

      #resetButton:hover {
        box-shadow: 0 6px 20px rgba(244, 67, 54, 0.4);
      }

      /* Floating Hint */
      #floatingHint {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.9);
        backdrop-filter: blur(10px);
        color: white;
        padding: 20px 40px;
        border-radius: 15px;
        font-size: 18px;
        font-weight: 600;
        text-align: center;
        z-index: 2000;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.4s ease;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
        max-width: 80%;
        border: 2px solid rgba(255, 235, 59, 0.3);
      }

      #floatingHint.show {
        opacity: 1;
        animation: hintPulse 0.5s ease;
      }

      @keyframes hintPulse {
        0%,
        100% {
          transform: translate(-50%, -50%) scale(1);
        }
        50% {
          transform: translate(-50%, -50%) scale(1.05);
        }
      }

      /* Color Legend */
      #colorLegend {
        position: absolute;
        bottom: 120px;
        left: 20px;
        width: 280px;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(10px);
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-radius: 15px;
        padding: 15px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        z-index: 1000;
      }

      #colorLegend h3 {
        color: #ffeb3b;
        font-size: 16px;
        margin-bottom: 15px;
        text-align: center;
      }

      .legend-item {
        display: flex;
        align-items: center;
        margin: 8px 0;
        padding: 8px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 8px;
      }

      .legend-color {
        width: 20px;
        height: 20px;
        border-radius: 4px;
        margin-right: 10px;
        border: 1px solid rgba(255, 255, 255, 0.3);
      }

      .legend-text {
        font-size: 13px;
        color: white;
      }

      /* Responsive Design */
      @media (max-width: 768px) {
        #instructionsPanel,
        #statusPanel,
        #colorLegend {
          width: 250px;
          padding: 15px;
        }

        #mainTitle {
          width: 90%;
          padding: 10px 20px;
        }

        #mainTitle h1 {
          font-size: 20px;
        }

        .control-btn {
          padding: 10px 20px;
          font-size: 14px;
        }

        #paperCounter {
          width: 180px;
          padding: 15px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Main Title -->
    <div id="mainTitle">
      <h1>⚡ Static Electricity Physics Lab</h1>
      <p>Drag ruler on wool cloth to charge it, then attract paper pieces</p>
    </div>

    <!-- Status Panel -->
    <div id="statusPanel">
      <h2>📊 Status Monitor</h2>
      <div class="status-row">
        <div class="status-label">Static Charge Level</div>
        <div class="status-value" id="chargeStatus">NEUTRAL</div>
        <div class="charge-meter">
          <div class="charge-indicator" id="chargeMeterIndicator"></div>
        </div>
      </div>
      <div class="status-row">
        <div class="status-label">Papers Attracted</div>
        <div class="status-value" id="paperStatus">0 / 10</div>
      </div>
      <div class="status-row">
        <div class="status-label">Rubbing Speed</div>
        <div class="status-value" id="speedStatus">0 cm/s</div>
      </div>
      <div class="status-row">
        <div class="status-label">Electron Transfer</div>
        <div class="status-value" id="electronStatus">0 e⁻</div>
      </div>
    </div>

    <!-- Paper Counter -->
    <div id="paperCounter">
      <h3>📄 Papers Collected</h3>
      <div class="counter-display" id="paperCounterNumber">0</div>
      <p>out of 10</p>
    </div>

    <!-- Control Panel -->
    <div id="controlPanel">
      <button class="control-btn" id="resetButton">🔄 Reset Experiment</button>
    </div>

    <!-- Floating Hint -->
    <div id="floatingHint"></div>

    <!-- Canvas Container -->
    <div id="canvasContainer"></div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script src="index.js"></script>
      
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Realistic Circuit Simulator</title>
    <style>
      :root {
        --wire-color: #2c3e50;
        --electron-color: #ffd700;
        --accent: #3498db;
        --bulb-hot: #ff9500;
        --switch-on: #27ae60;
        --switch-off: #e74c3c;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #1a2980 0%, #26d0ce 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        min-height: 100vh;
      }

      h1 {
        color: white;
        text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.4);
        margin-bottom: 10px;
        font-size: 2.5em;
      }

      .subtitle {
        color: rgba(255, 255, 255, 0.85);
        margin-bottom: 20px;
        font-size: 16px;
      }

      .workbench {
        display: flex;
        gap: 30px;
        justify-content: center;
        max-width: 1200px;
        width: 100%;
        flex-direction: row-reverse;
      }

      .circuit-board {
        position: relative;
        width: 700px;
        height: 550px;
        background: linear-gradient(160deg, #1e3c72 0%, #2a5298 100%);
        border-radius: 20px;
        box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
        border: 3px solid rgba(255, 255, 255, 0.1);
        overflow: hidden;
      }

      svg {
        width: 100%;
        height: 100%;
        position: relative;
      }

      .wire {
        fill: none;
        stroke: var(--wire-color);
        stroke-width: 6;
        stroke-linecap: round;
      }

      .switch-arm {
        stroke: var(--wire-color);
        stroke-width: 6;
        stroke-linecap: round;
        transform-origin: 100px 470px;
        transition:
          transform 0.5s,
          stroke 0.3s;
        cursor: pointer;
      }

      .switch-open {
        transform: rotate(-35deg);
        stroke: var(--switch-off);
      }

      .switch-closed {
        transform: rotate(0deg);
        stroke: var(--switch-on);
      }

      .switch-contact {
        fill: #34495e;
        stroke: #2c3e50;
        stroke-width: 2;
        cursor: pointer;
      }

      .bulb-filament {
        fill: none;
        stroke: #bdc3c7;
        stroke-width: 3;
        stroke-linecap: round;
        transition:
          stroke 0.3s,
          stroke-width 0.3s;
      }

      .bulb-glow {
        fill: #ffff00;
        filter: blur(30px);
        opacity: 0;
        transition:
          opacity 0.5s,
          filter 0.5s;
      }

      .bulb-hotspot {
        fill: #ffffff;
        filter: blur(5px);
        opacity: 0;
        transition: opacity 0.5s;
      }

      .resistor-comp {
        position: absolute;
        width: 110px;
        height: 35px;
        background: linear-gradient(180deg, #f5f5f5 0%, #e0e0e0 100%);
        border-radius: 17.5px;
        display: flex;
        align-items: center;
        justify-content: space-evenly;
        border: 2px solid #999;
        z-index: 10;
      }

      .band {
        width: 10px;
        height: 100%;
        border-radius: 2px;
      }

      #r1-visual {
        top: 155px;
        left: 195px;
      }
      #r2-visual {
        top: 275px;
        left: 195px;
      }

      .label {
        position: absolute;
        font-size: 13px;
        font-weight: 600;
        background: rgba(255, 255, 255, 0.95);
        padding: 4px 8px;
        border-radius: 5px;
        pointer-events: none;
        color: #2c3e50;
        border: 2px solid rgba(255, 255, 255, 0.5);
        z-index: 5;
      }

      .controls {
        flex: 1;
        min-width: 350px;
        background: white;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      }

      .control-group {
        margin-bottom: 22px;
        padding-bottom: 18px;
        border-bottom: 2px solid #ecf0f1;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #2c3e50;
      }

      input[type="range"] {
        width: 100%;
        height: 6px;
        border-radius: 3px;
        background: #ecf0f1;
        outline: none;
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
      }

      .value-display {
        float: right;
        color: var(--accent);
        font-family: "Courier New", monospace;
        font-weight: bold;
      }

      .power-btn {
        width: 100%;
        padding: 18px;
        font-size: 20px;
        font-weight: bold;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s;
        margin-bottom: 25px;
      }

      .btn-on {
        background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
        color: white;
      }

      .btn-off {
        background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        color: white;
      }

      .multimeter {
        background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
        color: #00ff00;
        padding: 18px;
        border-radius: 10px;
        font-family: "Courier New", monospace;
        border: 4px solid #333;
      }

      .mm-title {
        text-align: center;
        font-weight: bold;
        margin-bottom: 12px;
        color: #ffff00;
        font-size: 14px;
      }

      .mm-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
        font-size: 14px;
      }

      .mm-total {
        border-top: 2px dashed #555;
        padding-top: 10px;
        margin-top: 10px;
        font-weight: bold;
        color: #00ffff;
      }

      .status {
        text-align: center;
        padding: 10px;
        margin-bottom: 15px;
        border-radius: 8px;
        font-weight: bold;
      }

      .status-on {
        background: rgba(46, 204, 113, 0.1);
        color: #27ae60;
        border: 2px solid #27ae60;
      }

      .status-off {
        background: rgba(231, 76, 60, 0.1);
        color: #c0392b;
        border: 2px solid #c0392b;
      }

      .bulb-status {
        display: flex;
        align-items: center;
        margin-top: 10px;
        padding: 8px 12px;
        background: rgba(255, 193, 7, 0.1);
        border-radius: 6px;
        font-size: 13px;
      }

      .bulb-status-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-right: 8px;
        background: #e74c3c;
        transition: all 0.5s;
      }

      .bulb-status-dot.on {
        background: #ffd700;
        box-shadow: 0 0 15px #ffd700;
        animation: bulbPulse 1.5s infinite;
      }

      @keyframes bulbPulse {
        0%,
        100% {
          opacity: 0.8;
        }
        50% {
          opacity: 1;
        }
      }

      /* Realistic battery styles */
      .battery-terminal {
        fill: #aaa;
        stroke: #888;
        stroke-width: 1;
      }

      .battery-body {
        fill: #e0e0e0;
        stroke: #555;
        stroke-width: 2;
      }

      .battery-highlight {
        fill: #fff;
        opacity: 0.3;
      }
    </style>
  </head>
  <body>
    <h1> Paraller💡 Realistic Circuit Simulator</h1>
    <p class="subtitle">Watch the bulb glow when you turn on the switch!</p>

    <div class="workbench">
      <div class="circuit-board">
        <svg id="circuit-svg">
          <!-- Main power lines -->
          <path d="M 50 250 L 50 80 L 150 80" class="wire" />
          <path d="M 50 250 L 50 470 L 100 470" class="wire" />

          <!-- Switch -->
          <circle cx="100" cy="470" r="9" class="switch-contact" />
          <circle cx="160" cy="470" r="9" class="switch-contact" />
          <line
            id="switch-visual"
            x1="100"
            y1="470"
            x2="160"
            y2="470"
            class="switch-arm switch-open"
          />
          <path d="M 160 470 L 650 470 L 650 250" class="wire" />

          <!-- Top junction to parallel branches -->
          <path d="M 150 80 L 150 170" class="wire" />
          <path d="M 150 170 L 150 290" class="wire" />
          <path d="M 150 170 L 150 410" class="wire" />

          <!-- R1 branch -->
          <path d="M 150 170 L 180 170" class="wire" />
          <path d="M 320 170 L 650 170" class="wire" />

          <!-- R2 branch -->
          <path d="M 150 290 L 180 290" class="wire" />
          <path d="M 320 290 L 650 290" class="wire" />

          <!-- Bulb branch -->
          <path d="M 150 410 L 450 410" class="wire" />
          <path d="M 550 410 L 650 410" class="wire" />

          <!-- Bottom junction -->
          <path d="M 650 170 L 650 290" class="wire" />
          <path d="M 650 290 L 650 410" class="wire" />

          <!-- Realistic Battery -->
          <g id="battery" transform="translate(25, 230)">
            <!-- Battery body with 3D effect -->
            <rect
              x="0"
              y="0"
              width="50"
              height="40"
              rx="5"
              class="battery-body"
            />
            <!-- Top highlight -->
            <rect
              x="5"
              y="2"
              width="40"
              height="3"
              rx="1"
              class="battery-highlight"
            />
            <!-- Positive terminal -->
            <rect
              x="50"
              y="15"
              width="6"
              height="10"
              rx="2"
              class="battery-terminal"
            />
            <!-- Negative terminal -->
            <rect
              x="-6"
              y="15"
              width="6"
              height="10"
              rx="2"
              class="battery-terminal"
            />
            <!-- Plus sign -->
            <line
              x1="15"
              y1="10"
              x2="35"
              y2="10"
              stroke="#e74c3c"
              stroke-width="5"
              stroke-linecap="round"
            />
            <!-- Minus sign -->
            <line
              x1="20"
              y1="30"
              x2="30"
              y2="30"
              stroke="#3498db"
              stroke-width="7"
              stroke-linecap="round"
            />
            <!-- Labels -->
            <text
              x="60"
              y="18"
              font-family="Arial"
              font-size="16"
              fill="#e74c3c"
              font-weight="bold"
            >
              +
            </text>
            <text
              x="60"
              y="35"
              font-family="Arial"
              font-size="16"
              fill="#3498db"
              font-weight="bold"
            >
              −
            </text>
          </g>

          <!-- Bulb with multiple glow layers for brightness -->
          <g id="bulb-group" transform="translate(500, 410)">
            <!-- Outer glow (largest) -->
            <circle
              id="bulb-glow-outer"
              cx="0"
              cy="-20"
              r="90"
              class="bulb-glow"
              style="fill: #ff9500"
            />

            <!-- Middle glow -->
            <circle
              id="bulb-glow-middle"
              cx="0"
              cy="-20"
              r="70"
              class="bulb-glow"
              style="fill: #ffcc00"
            />

            <!-- Inner glow (brightest) -->
            <circle
              id="bulb-glow-inner"
              cx="0"
              cy="-20"
              r="50"
              class="bulb-glow"
              style="fill: #ffff00"
            />

            <!-- Hot spot in center -->
            <circle
              id="bulb-hotspot"
              cx="0"
              cy="-20"
              r="10"
              class="bulb-hotspot"
            />

            <!-- Bulb structure -->
            <rect x="-18" y="12" width="36" height="25" rx="3" fill="#95a5a6" />
            <path
              d="M -18 17 L 18 17 M -18 23 L 18 23 M -18 29 L 18 29"
              stroke="#7f8c8d"
              stroke-width="1.5"
            />
            <circle
              cx="0"
              cy="-20"
              r="30"
              fill="rgba(255, 255, 255, 0.2)"
              stroke="rgba(255, 255, 255, 0.3)"
              stroke-width="2.5"
            />

            <!-- Filament -->
            <path
              id="bulb-filament"
              d="M -12 12 L -6 -8 L 0 -12 L 6 -8 L 12 12"
              class="bulb-filament"
            />
          </g>
        </svg>

        <!-- Resistor visuals -->
        <div id="r1-visual" class="resistor-comp">
          <div class="band b1"></div>
          <div class="band b2"></div>
          <div class="band b3"></div>
          <div class="band b4" style="background-color: gold"></div>
        </div>

        <div id="r2-visual" class="resistor-comp">
          <div class="band b1"></div>
          <div class="band b2"></div>
          <div class="band b3"></div>
          <div class="band b4" style="background-color: gold"></div>
        </div>

        <!-- Labels -->
        <div class="label" style="top: 135px; left: 230px">R1</div>
        <div class="label" style="top: 255px; left: 230px">R2</div>
        <div class="label" style="top: 365px; left: 485px">BULB</div>
        <div class="label" style="top: 485px; left: 110px">SWITCH</div>
        <div class="label" style="top: 235px; left: 95px">BATTERY</div>
      </div>

      <div class="controls">
        <button id="btn-power" class="power-btn btn-on" onclick="togglePower()">
          <span id="btn-text">Turn On</span>
        </button>

        <div id="circuit-status" class="status status-off">Circuit is OFF</div>

        <div class="bulb-status">
          <div id="bulb-status-dot" class="bulb-status-dot"></div>
          <span id="bulb-status-text">Bulb is OFF</span>
        </div>

        <div class="control-group">
          <label
            >Battery Voltage
            <span id="val-v" class="value-display">12.0 V</span></label
          >
          <input
            type="range"
            id="input-voltage"
            min="0"
            max="24"
            value="12"
            step="0.5"
          />
        </div>

        <div class="control-group">
          <label
            >R1 Resistance
            <span id="val-r1" class="value-display">100 Ω</span></label
          >
          <input
            type="range"
            id="input-r1"
            min="10"
            max="500"
            value="100"
            step="10"
          />
        </div>

        <div class="control-group">
          <label
            >R2 Resistance
            <span id="val-r2" class="value-display">200 Ω</span></label
          >
          <input
            type="range"
            id="input-r2"
            min="10"
            max="500"
            value="200"
            step="10"
          />
        </div>

        <div class="control-group">
          <label
            >Bulb Resistance
            <span id="val-bulb" class="value-display">50 Ω</span></label
          >
          <input
            type="range"
            id="input-bulb"
            min="5"
            max="200"
            value="50"
            step="5"
          />
          <small
            style="
              color: #777;
              font-size: 12px;
              display: block;
              margin-top: 8px;
            "
            >💡 Lower = Brighter</small
          >
        </div>

        <div class="multimeter">
          <div class="mm-title">📊 CIRCUIT METER</div>
          <div class="mm-row">
            <span>R1 Current:</span> <span id="stat-i1">0.000 A</span>
          </div>
          <div class="mm-row">
            <span>R2 Current:</span> <span id="stat-i2">0.000 A</span>
          </div>
          <div class="mm-row">
            <span>Bulb Current:</span> <span id="stat-i3">0.000 A</span>
          </div>
          <div class="mm-row mm-total">
            <span>TOTAL Current:</span> <span id="stat-it">0.000 A</span>
          </div>
          <div class="mm-row" style="margin-top: 10px">
            <span>Bulb Brightness:</span> <span id="stat-brightness">0%</span>
          </div>
        </div>
      </div>
    </div>

    <script src="index.js">
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sound Wave Propagation</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Comic Sans MS", cursive, sans-serif;
        background: linear-gradient(to bottom, #87ceeb, #e0f7fa);
        color: #333;
        line-height: 1.6;
        overflow-x: hidden;
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 1000px;
        margin: 0 auto;
      }

      header {
        text-align: center;
        margin-bottom: 20px;
        padding: 20px;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 15px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        border: 5px solid #ffd700;
      }

      h1 {
        color: #2c3e50;
        margin-bottom: 10px;
        font-size: 2.5rem;
        text-shadow: 2px 2px 0 #ffd700;
      }

      .subtitle {
        color: #7f8c8d;
        font-size: 1.2rem;
      }

      .content {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        margin-bottom: 20px;
      }

      .simulation-container {
        flex: 2;
        min-width: 300px;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 15px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        padding: 15px;
        position: relative;
        overflow: hidden;
        border: 5px solid #3498db;
      }

      .info-panel {
        flex: 1;
        min-width: 250px;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 15px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        padding: 15px;
        border: 5px solid #2ecc71;
      }

      .canvas-container {
        position: relative;
        width: 100%;
        height: 400px;
        background: #e8f4f8;
        border-radius: 10px;
        overflow: hidden;
        border: 2px solid #b3e0f2;
      }

      #simulationCanvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      .controls {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-top: 15px;
        flex-wrap: wrap;
      }

      button {
        background: linear-gradient(to bottom, #3498db, #2980b9);
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 50px;
        cursor: pointer;
        font-size: 1rem;
        font-weight: 600;
        transition: all 0.3s;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      button:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 8px rgba(0, 0, 0, 0.15);
        background: linear-gradient(to bottom, #2980b9, #2573a7);
      }

      button:active {
        transform: translateY(1px);
      }

      button:disabled {
        background: linear-gradient(to bottom, #bdc3c7, #95a5a6);
        cursor: not-allowed;
        transform: none;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }

      .info-section {
        margin-bottom: 20px;
      }

      .info-section h3 {
        color: #2c3e50;
        margin-bottom: 10px;
        padding-bottom: 5px;
        border-bottom: 2px solid #3498db;
        font-size: 1.3rem;
      }

      .info-section p {
        margin-bottom: 10px;
        color: #555;
        font-size: 1rem;
      }

      .wave-explanation {
        background: #e8f4f8;
        padding: 15px;
        border-radius: 10px;
        margin-top: 15px;
      }

      .status {
        text-align: center;
        padding: 12px;
        margin-top: 15px;
        background: #e8f4f8;
        border-radius: 10px;
        font-weight: 600;
        color: #2c3e50;
        transition: all 0.3s;
        font-size: 1.1rem;
      }

      .status.active {
        background: #d4edda;
        color: #155724;
      }

      .status.responding {
        background: #fff3cd;
        color: #856404;
      }

      .legend {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 15px;
        flex-wrap: wrap;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 0.9rem;
      }

      .legend-color {
        width: 20px;
        height: 20px;
        border-radius: 50%;
      }

      .compression {
        background: #1a5276;
      }

      .rarefaction {
        background: #85c1e9;
      }

      .character {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
        padding: 10px;
        border-radius: 10px;
        background: #f8f9fa;
      }

      .speech-bubble {
        position: relative;
        background: #fff;
        border-radius: 10px;
        padding: 10px;
        border: 2px solid #3498db;
        max-width: 200px;
      }

      .speech-bubble:after {
        content: "";
        position: absolute;
        left: -10px;
        top: 15px;
        width: 0;
        height: 0;
        border: 10px solid transparent;
        border-right-color: #3498db;
        border-left: 0;
      }

      footer {
        text-align: center;
        margin-top: 20px;
        padding: 15px;
        color: #7f8c8d;
        font-size: 0.9rem;
      }

      .fun-fact {
        background: #fff3cd;
        padding: 10px;
        border-radius: 10px;
        margin-top: 10px;
        border-left: 5px solid #ffc107;
      }

      @media (max-width: 768px) {
        .content {
          flex-direction: column;
        }

        h1 {
          font-size: 2rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Sound Wave Propagation</h1>
        <p class="subtitle">How Sound Travels from a Person to a Bird</p>
      </header>

      <div class="content">
        <div class="simulation-container">
          <div class="canvas-container">
            <canvas id="simulationCanvas"></canvas>
          </div>

          <div class="controls">
            <button id="callBtn">🔊 Call Bird</button>
            <button id="resetBtn">🔄 Reset</button>
          </div>

          <div id="status" class="status">
            Press "Call Bird" to see how sound travels!
          </div>

          <div class="legend">
            <div class="legend-item">
              <div class="legend-color compression"></div>
              <span>High Pressure (Compression)</span>
            </div>
            <div class="legend-item">
              <div class="legend-color rarefaction"></div>
              <span>Low Pressure (Rarefaction)</span>
            </div>
          </div>
        </div>
        
    </div>

    <script>
      // Canvas setup
      const canvas = document.getElementById("simulationCanvas");
      const ctx = canvas.getContext("2d");

      // HiDPI / responsive canvas
      function setCanvasSize() {
        const container = canvas.parentElement;
        const cssW = container.clientWidth;
        const cssH = container.clientHeight;
        const dpr = window.devicePixelRatio || 1;
        canvas.style.width = cssW + "px";
        canvas.style.height = cssH + "px";
        canvas.width = Math.round(cssW * dpr);
        canvas.height = Math.round(cssH * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      setCanvasSize();
      window.addEventListener("resize", setCanvasSize);

      // Simulation variables
      let isCalling = false;
      let animationId = null;
      let lastTime = null;
      let waves = []; // {radius, speed, alpha, amplitude}
      const waveSpeedPxPerSec = 220; // realistic-looking speed in px/s

      // Elements
      const callBtn = document.getElementById("callBtn");
      const resetBtn = document.getElementById("resetBtn");
      const statusDiv = document.getElementById("status");

      // Source and geometry helpers that depend on canvas size
      function soundSourcePos() {
        return {
          x: (canvas.width * 0.2) / (window.devicePixelRatio || 1),
          y: (canvas.height * 0.6) / (window.devicePixelRatio || 1),
        };
      }
      function treePerchPos() {
        // replicate logic from drawTree so positions match
        const treeX = (canvas.width * 0.8) / (window.devicePixelRatio || 1);
        const groundY = (canvas.height * 0.7) / (window.devicePixelRatio || 1);
        const trunkHeight =
          (canvas.height * 0.25) / (window.devicePixelRatio || 1);
        const trunkWidth = Math.max(
          24,
          (canvas.width * 0.03) / (window.devicePixelRatio || 1)
        );
        const branchEndX =
          treeX -
          Math.min((canvas.width * 0.18) / (window.devicePixelRatio || 1), 180);
        const branchEndY =
          groundY -
          trunkHeight * 0.6 -
          Math.min(10, (canvas.height * 0.02) / (window.devicePixelRatio || 1));
        return { x: branchEndX - 8, y: branchEndY - 6 };
      }

      // Wave creation (concentric expanding wavefront)
      function createWave() {
        waves.push({
          radius: 0,
          speed: waveSpeedPxPerSec,
          alpha: 1,
          amplitude: 12,
        });
      }

      // Update waves using dt in seconds
      function updateWaves(dt) {
        for (let i = waves.length - 1; i >= 0; i--) {
          const w = waves[i];
          w.radius += w.speed * dt;
          // simple attenuation: alpha decays with radius
          w.alpha = Math.max(0, 1 - w.radius / (canvas.width * 0.9));
          if (
            w.alpha <= 0.02 ||
            w.radius > Math.max(canvas.width, canvas.height) * 2
          ) {
            waves.splice(i, 1);
          }
        }
      }

      // Drawing functions (use scaled coords consistent with HiDPI transform)
      function drawBackground() {
        // Sky
        ctx.fillStyle = "#e8f4f8";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const dpr = window.devicePixelRatio || 1;
        const cw = canvas.width / dpr;
        const ch = canvas.height / dpr;

        // Sun (scaled)
        ctx.fillStyle = "#FFD700";
        ctx.beginPath();
        ctx.arc(cw - 50, 50, 30, 0, Math.PI * 2);
        ctx.fill();

        // Clouds
        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(100, 80, 20, 0, Math.PI * 2);
        ctx.arc(130, 70, 25, 0, Math.PI * 2);
        ctx.arc(160, 80, 20, 0, Math.PI * 2);
        ctx.fill();

        // Ground
        const groundHeight = ch * 0.3;
        ctx.fillStyle = "#7ec850";
        ctx.fillRect(0, ch - groundHeight, cw, groundHeight);

        // Grass (simple)
        ctx.fillStyle = "#6ab04c";
        for (let i = 0; i < cw; i += 18) {
          const height = 6 + (i % 30 === 0 ? 8 : 2);
          ctx.fillRect(i, ch - groundHeight, 10, height);
        }

        // Flowers
        ctx.fillStyle = "#e74c3c";
        ctx.beginPath();
        ctx.arc(200, ch - groundHeight - 10, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#f1c40f";
        ctx.beginPath();
        ctx.arc(200, ch - groundHeight - 10, 2, 0, Math.PI * 2);
        ctx.fill();
      }

      // Draw tree (unchanged visuals but uses scaled coords)
      function drawTree() {
        const dpr = window.devicePixelRatio || 1;
        const cw = canvas.width / dpr;
        const ch = canvas.height / dpr;

        const treeX = cw * 0.8;
        const groundY = ch * 0.7;
        const trunkHeight = ch * 0.25;
        const trunkWidth = Math.max(24, cw * 0.03);

        const grd = ctx.createLinearGradient(
          treeX - trunkWidth,
          groundY - trunkHeight,
          treeX + trunkWidth,
          groundY
        );
        grd.addColorStop(0, "#8b4513");
        grd.addColorStop(1, "#5d2b0c");
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.moveTo(treeX - trunkWidth / 2, groundY);
        ctx.quadraticCurveTo(
          treeX - trunkWidth * 0.9,
          groundY - trunkHeight * 0.4,
          treeX - trunkWidth * 0.3,
          groundY - trunkHeight
        );
        ctx.lineTo(treeX + trunkWidth * 0.3, groundY - trunkHeight);
        ctx.quadraticCurveTo(
          treeX + trunkWidth * 0.9,
          groundY - trunkHeight * 0.4,
          treeX + trunkWidth / 2,
          groundY
        );
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = "rgba(0,0,0,0.08)";
        ctx.lineWidth = 2;
        for (let i = 0; i < 6; i++) {
          const xOff = (i - 3) * 4;
          ctx.beginPath();
          ctx.moveTo(treeX + xOff, groundY - trunkHeight * 0.95);
          ctx.quadraticCurveTo(
            treeX + xOff * 1.5,
            groundY - trunkHeight * 0.6,
            treeX + xOff * 0.5,
            groundY
          );
          ctx.stroke();
        }

        const branchStartX = treeX - trunkWidth * 0.2;
        const branchStartY = groundY - trunkHeight * 0.6;
        const branchEndX = treeX - Math.min(cw * 0.18, 180);
        const branchEndY = branchStartY - Math.min(10, ch * 0.02);

        ctx.strokeStyle = "#6b3b14";
        ctx.lineWidth = Math.max(6, trunkWidth * 0.6);
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(branchStartX, branchStartY);
        ctx.quadraticCurveTo(
          treeX - trunkWidth - 40,
          branchStartY - 18,
          branchEndX,
          branchEndY
        );
        ctx.stroke();

        ctx.lineWidth = Math.max(3, trunkWidth * 0.35);
        ctx.beginPath();
        ctx.moveTo(treeX + trunkWidth * 0.15, groundY - trunkHeight * 0.45);
        ctx.quadraticCurveTo(
          treeX + trunkWidth + 40,
          groundY - trunkHeight * 0.55,
          treeX + trunkWidth + 80,
          groundY - trunkHeight * 0.6
        );
        ctx.stroke();

        function drawFoliage(cx, cy, r, c1, c2) {
          ctx.fillStyle = c1;
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = c2;
          ctx.beginPath();
          ctx.arc(cx - r * 0.45, cy - r * 0.45, r * 0.75, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(cx + r * 0.5, cy - r * 0.55, r * 0.85, 0, Math.PI * 2);
          ctx.fill();
        }

        const foliageRadius = Math.max(40, cw * 0.08);
        drawFoliage(
          treeX,
          groundY - trunkHeight - foliageRadius / 2,
          foliageRadius,
          "#2ecc71",
          "#27ae60"
        );
        drawFoliage(
          treeX - foliageRadius * 1.05,
          groundY - trunkHeight - foliageRadius * 0.15,
          foliageRadius * 0.9,
          "#27ae60",
          "#1e8449"
        );
        drawFoliage(
          treeX + foliageRadius * 0.6,
          groundY - trunkHeight - foliageRadius * 0.9,
          foliageRadius * 0.8,
          "#229954",
          "#2ecc71"
        );

        return {
          x: branchEndX - 8,
          y: branchEndY - 6,
        };
      }

      // Draw bird (scaled coords)
      function drawBird(x, y, isFlying = false) {
        ctx.save();
        const size = 15;
        // body
        ctx.fillStyle = "#f1c40f";
        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.fill();
        // head
        ctx.beginPath();
        ctx.arc(x + size - 2, y - size / 2, size / 1.5, 0, Math.PI * 2);
        ctx.fill();
        // beak
        ctx.fillStyle = "#e67e22";
        ctx.beginPath();
        ctx.moveTo(x + size + 5, y - size / 2);
        ctx.lineTo(x + size + 12, y - size / 2);
        ctx.lineTo(x + size + 5, y - size / 2 + 5);
        ctx.fill();
        // eye
        ctx.fillStyle = "#2c3e50";
        ctx.beginPath();
        ctx.arc(x + size + 2, y - size / 2 - 2, 3, 0, Math.PI * 2);
        ctx.fill();
        // wing
        const wingOffset = isFlying ? Math.sin(Date.now() / 150) * 8 : 0;
        ctx.fillStyle = "#d4ac0d";
        ctx.beginPath();
        ctx.ellipse(
          x - size / 3,
          y + wingOffset,
          size / 1.5,
          size / 2,
          0,
          0,
          Math.PI * 2
        );
        ctx.fill();
        // tail
        ctx.beginPath();
        ctx.moveTo(x - size, y);
        ctx.lineTo(x - size - 10, y - 8);
        ctx.lineTo(x - size - 10, y + 8);
        ctx.closePath();
        ctx.fill();

        // motion lines if flying
        if (isFlying) {
          ctx.strokeStyle = "rgba(0,0,0,0.3)";
          ctx.setLineDash([5, 5]);
          ctx.beginPath();
          ctx.moveTo(x - size - 15, y);
          ctx.lineTo(x - size - 25, y);
          ctx.stroke();
          ctx.setLineDash([]);
        }
        ctx.restore();
      }

      // Draw human (scaled)
      function drawHuman() {
        const dpr = window.devicePixelRatio || 1;
        const cw = canvas.width / dpr;
        const ch = canvas.height / dpr;
        const x = cw * 0.2;
        const y = ch * 0.7;

        ctx.fillStyle = "#3498db";
        ctx.fillRect(x - 15, y - 70, 30, 70);

        ctx.fillStyle = "#ffdbac";
        ctx.beginPath();
        ctx.arc(x, y - 85, 18, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#2c3e50";
        ctx.beginPath();
        ctx.arc(x, y - 92, 18, 0, Math.PI, true);
        ctx.fill();

        ctx.fillStyle = "#2c3e50";
        ctx.beginPath();
        ctx.arc(x - 6, y - 88, 3, 0, Math.PI * 2);
        ctx.arc(x + 6, y - 88, 3, 0, Math.PI * 2);
        ctx.fill();

        // mouth
        ctx.beginPath();
        if (isCalling) {
          ctx.arc(x, y - 80, 6, 0, Math.PI, false);
        } else {
          ctx.moveTo(x - 4, y - 78);
          ctx.lineTo(x + 4, y - 78);
        }
        ctx.stroke();

        // arms
        ctx.fillStyle = "#ffdbac";
        ctx.fillRect(x - 25, y - 50, 12, 50);
        ctx.fillRect(x + 13, y - 50, 12, 50);

        // legs
        ctx.fillStyle = "#2c3e50";
        ctx.fillRect(x - 12, y, 10, 50);
        ctx.fillRect(x + 2, y, 10, 50);

        return { x, y };
      }

      // Draw waves as concentric circles with pressure visualization
      function drawWaves() {
        const s = soundSourcePos();
        waves.forEach((w, idx) => {
          // Draw the main wave circle
          ctx.beginPath();
          ctx.arc(s.x, s.y, w.radius, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(52,152,219,${Math.max(0.02, w.alpha * 0.9)})`;
          ctx.lineWidth = 2 + (1 - w.alpha) * 2;
          ctx.stroke();

          // Draw compression and rarefaction patterns
          const segments = 16;
          for (let i = 0; i < segments; i++) {
            const angle = (i / segments) * Math.PI * 2;
            const angle2 = ((i + 1) / segments) * Math.PI * 2;
            
            // Alternate between compression and rarefaction
            const isCompression = i % 2 === 0;
            
            // Draw compression (thicker, darker) or rarefaction (thinner, lighter)
            ctx.beginPath();
            ctx.arc(s.x, s.y, w.radius, angle, angle2);
            ctx.strokeStyle = isCompression 
              ? `rgba(26,82,118,${w.alpha * 0.7})` 
              : `rgba(133,193,233,${w.alpha * 0.7})`;
            ctx.lineWidth = isCompression ? 4 : 2;
            ctx.stroke();
          }

          // Label for first visible wave
          if (idx === 0 && w.alpha > 0.4) {
            ctx.fillStyle = `rgba(52,152,219,${w.alpha})`;
            ctx.font = "14px Comic Sans MS";
            ctx.fillText("Sound Wave", s.x + w.radius - 30, s.y - 10);
          }
        });
      }

      // Sound source indicator near human
      function drawSoundSource() {
        if (!isCalling) return;
        const s = soundSourcePos();
        const pulse = 10 + Math.sin(Date.now() / 120) * 5;
        ctx.fillStyle = "rgba(231,76,60,0.7)";
        ctx.beginPath();
        ctx.arc(s.x, s.y, pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#e74c3c";
        ctx.beginPath();
        ctx.arc(s.x, s.y, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#e74c3c";
        ctx.font = "14px Comic Sans MS";
        ctx.fillText("Sound Source", s.x - 40, s.y - 20);
      }

      // bird state
      let birdState = null;

      // Main animation loop using high-resolution timestamps
      function animate(currentTime) {
        if (!lastTime) lastTime = currentTime;
        const dt = Math.max(0, (currentTime - lastTime) / 1000);
        lastTime = currentTime;

        // clear (full canvas)
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        drawBackground();
        const perch = drawTree();

        // initialize bird on first frame
        if (!birdState) {
          birdState = {
            x: perch.x,
            y: perch.y,
            isFlying: false,
            perched: true,
          };
        }

        drawSoundSource();
        drawWaves();
        const humanPos = drawHuman();

        // keep perched bird anchored to branch (in case of resize)
        if (birdState.perched) {
          birdState.x = perch.x;
          birdState.y = perch.y;
        }

        // check if any wave reached bird perch (distance check)
        const s = soundSourcePos();
        const birdPerch = { x: birdState.x, y: birdState.y };
        const dx = birdPerch.x - s.x;
        const dy = birdPerch.y - s.y;
        const distToBird = Math.sqrt(dx * dx + dy * dy);

        if (isCalling && waves.length > 0 && birdState.perched) {
          for (let w of waves) {
            // trigger when wavefront crosses perch distance
            if (w.radius >= distToBird - 20 && w.radius <= distToBird + 20) {
              // bird hears and flies away
              birdState.isFlying = true;
              birdState.perched = false;
              statusDiv.textContent = "The bird heard you! It's flying away!";
              statusDiv.className = "status responding";
              break;
            }
          }
        }

        // bird flight update (away from human)
        if (birdState.isFlying) {
          const targetX = canvas.width + 50; // fly off the screen to the right
          const targetY = birdState.y - 100; // fly upward
          const dx2 = targetX - birdState.x;
          const dy2 = targetY - birdState.y;
          const dist = Math.sqrt(dx2 * dx2 + dy2 * dy2);
          const speed = 160 * dt; // pixels per frame scaled by dt
          if (dist > 6) {
            birdState.x += (dx2 / dist) * speed;
            birdState.y += (dy2 / dist) * speed;
          } else {
            // Bird has flown away
            birdState.isFlying = false;
            statusDiv.textContent = "The bird has flown away!";
            statusDiv.className = "status";
          }
        }

        drawBird(birdState.x, birdState.y, birdState.isFlying);

        // update physics
        updateWaves(dt);

        animationId = requestAnimationFrame(animate);
      }

      // start animation
      animationId = requestAnimationFrame(animate);

      // Event listeners
      callBtn.addEventListener("click", () => {
        if (isCalling) return;
        isCalling = true;
        callBtn.disabled = true;
        statusDiv.textContent = "Making sound waves... Watch them travel!";
        statusDiv.className = "status active";

        // create pulses periodically
        const createInterval = setInterval(() => {
          if (isCalling) createWave();
          else clearInterval(createInterval);
        }, 350);

        // stop calling after 4 seconds
        setTimeout(() => {
          isCalling = false;
          callBtn.disabled = false;
          if (
            statusDiv.textContent !== "The bird heard you! It's flying away!"
          ) {
            statusDiv.textContent = "Sound waves sent!";
            statusDiv.className = "status";
          }
        }, 4000);
      });

      resetBtn.addEventListener("click", () => {
        isCalling = false;
        callBtn.disabled = false;
        waves = [];
        birdState = null;
        statusDiv.textContent = "Press 'Call Bird' to see how sound travels!";
        statusDiv.className = "status";
      });

      // re-init when window size changes
      window.addEventListener("resize", () => {
        setCanvasSize();
      });
    </script>
  </body>
</html>

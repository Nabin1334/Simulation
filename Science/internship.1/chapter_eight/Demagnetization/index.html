<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demagnetization</title>
    <style>
      :root {
        --bg-color: #1e1e24;
        --ui-bg: rgba(30, 30, 36, 0.95);
        --accent: #ff0055;
        --text: #ffffff;
      }

      body {
        margin: 0;
        overflow: hidden;
        background-color: var(--bg-color);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--text);
        user-select: none;
      }

      #canvas-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        background: radial-gradient(circle at center, #2b2b36 0%, #000000 100%);
      }

      canvas {
        display: block;
        cursor: grab;
      }
      canvas:active {
        cursor: grabbing;
      }

      /* HUD - Moved to Top Right for cleaner layout */
      #hud {
        position: absolute;
        top: 20px;
        right: 20px;
        width: 280px;
        pointer-events: none;
        text-align: right;
      }

      .panel {
        background: var(--ui-bg);
        padding: 15px;
        border-right: 4px solid var(--accent);
        border-radius: 4px;
        margin-bottom: 10px;
        display: inline-block;
        text-align: left;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      }

      h2 {
        margin: 0 0 5px 0;
        font-size: 16px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #aaa;
      }
      p {
        margin: 5px 0;
        font-size: 13px;
        font-weight: bold;
      }

      /* Meter */
      .meter-box {
        background: #000;
        height: 15px;
        width: 200px;
        border: 1px solid #555;
        margin-top: 5px;
        position: relative;
        display: block;
      }
      .meter-fill {
        height: 100%;
        background: linear-gradient(90deg, #ff0055, #ff9900);
        width: 100%;
        transition: width 0.1s linear;
      }

      /* CONTROLS - Moved to LEFT SIDE Vertical Column */
      #controls {
        position: absolute;
        left: 20px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 15px;
        pointer-events: auto;
        z-index: 100;
      }

      .tool-btn {
        background: #2b2b36;
        border: 1px solid #555;
        color: white;
        padding: 15px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-family: inherit;
        text-transform: uppercase;
        font-weight: bold;
        transition: 0.2s;
        display: flex;
        align-items: center;
        gap: 10px;
        box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.3);
        width: 200px;
      }

      .tool-btn:hover {
        background: #3a3a45;
        border-color: white;
        transform: translateX(5px);
      }

      .tool-btn:active {
        transform: scale(0.98);
      }
      .tool-btn.active {
        background: var(--accent);
        border-color: var(--accent);
      }

      /* Switch for Circuit - Moved to LEFT CENTER UPPER */
      #circuit-switch {
        position: absolute;
        left: 40px;
        top: 40px;
        width: 60px;
        height: 100px;
        background: #333;
        border: 2px solid #555;
        border-radius: 5px;
        cursor: pointer;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      }
      #circuit-switch.on {
        background: #004d00;
        border-color: #00ff00;
      }
      .switch-lever {
        width: 20px;
        height: 60px;
        background: #888;
        border-radius: 2px;
        transition: 0.3s;
        transform: translateY(15px);
      }
      #circuit-switch.on .switch-lever {
        transform: translateY(-15px);
        background: #00ff00;
        box-shadow: 0 0 10px #00ff00;
      }
      .switch-label {
        position: absolute;
        bottom: -25px;
        font-weight: bold;
        width: 100px;
        text-align: center;
        color: #aaa;
        pointer-events: none;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="canvas-container">
      <canvas id="simCanvas"></canvas>

      <div id="hud">
        <div class="panel">
          <h2>Magnetic Strength</h2>
          <div class="meter-box">
            <div class="meter-fill" id="strength-meter"></div>
          </div>
          <p id="strength-val">100%</p>
        </div>
        <br />
        <div class="panel">
          <h2>Status Info</h2>
          <p id="status-text">Select a tool from the left.</p>
        </div>
      </div>

      <div id="controls">
        <button class="tool-btn" onclick="toggleTool('candle')" id="btn-candle">
          🔥 Heat (Candle)
        </button>
        <button class="tool-btn" onclick="toggleTool('hammer')" id="btn-hammer">
          🔨 Hammer
        </button>
        <button class="tool-btn" onclick="toggleTool('coil')" id="btn-coil">
          ⚡ AC Coil
        </button>
        <button
          class="tool-btn"
          onclick="resetSim()"
          style="border-color: #4cd137"
        >
          🔄 Reset Lab
        </button>
      </div>

      <div id="circuit-switch" onclick="toggleCircuitSwitch()">
        <div class="switch-lever"></div>
        <div class="switch-label">COIL POWER</div>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>

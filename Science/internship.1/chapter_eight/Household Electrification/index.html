<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Electrical Control Lab | Interactive Simulation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
        }
        
        /* UI Panel - Clean and Modern */
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(12, 15, 25, 0.92);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 18px 24px;
            color: white;
            border: 1px solid rgba(100, 150, 255, 0.3);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            pointer-events: none;
            z-index: 100;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        
        #ui-panel h2 {
            margin: 0 0 12px 0;
            font-size: 1.35rem;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #aaffff, #4c9aff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 600;
        }
        
        .status-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 200px;
        }
        
        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 0.9rem;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .indicator {
            font-weight: 700;
            transition: all 0.2s;
            padding: 2px 10px;
            border-radius: 40px;
            background: rgba(0,0,0,0.4);
        }
        
        .indicator.on {
            color: #2effb0;
            text-shadow: 0 0 6px #00cc77;
            background: rgba(46, 255, 176, 0.15);
        }
        
        .indicator.off {
            color: #ff7b72;
            background: rgba(255, 70, 70, 0.1);
        }
        
        .instruction {
            font-size: 0.7rem;
            color: #ccc;
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.2);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .instruction span {
            background: rgba(0,0,0,0.5);
            padding: 3px 10px;
            border-radius: 20px;
            font-family: monospace;
        }
        
        #controls-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(5px);
            color: #ddd;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 12px;
            font-family: monospace;
            pointer-events: none;
            z-index: 100;
            letter-spacing: 0.5px;
        }
        
        /* Mobile hint adjustment */
        @media (max-width: 768px) {
            #ui-panel { padding: 12px 18px; top: 12px; left: 12px; }
            .status-item { font-size: 0.75rem; }
            .instruction span { font-size: 0.65rem; }
            #controls-info { font-size: 9px; bottom: 12px; left: 12px; }
        }
        
        /* subtle loading removed */
        .tooltip-marker {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: rgba(255,255,255,0.3);
            font-size: 10px;
            background: rgba(0,0,0,0.4);
            padding: 4px 12px;
            border-radius: 20px;
            pointer-events: none;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div id="ui-panel">
        <h2>⚡ ELECTRICAL COMMAND CENTER</h2>
        <div class="status-grid">
            <div class="status-item">
                <span>🔌 MAIN MCB</span>
                <span id="mcb-status" class="indicator on">ON</span>
            </div>
            <div class="status-item">
                <span>💡 LIGHTING</span>
                <span id="light-status" class="indicator off">OFF</span>
            </div>
            <div class="status-item">
                <span>🌀 CEILING FAN</span>
                <span id="fan-status" class="indicator off">OFF</span>
            </div>
        </div>
        <div class="instruction">
            <span>🖱️ CLICK switches / MCB</span>
            <span>🖱️🖱️ DRAG to rotate view</span>
            <span>🔍 SCROLL zoom</span>
        </div>
    </div>
    <div id="controls-info">
        🖱️ Left Click: Operate Devices | 🖱️ Right Drag: Rotate Camera
    </div>
    <div class="tooltip-marker">
        Real-time energy logic | Master-Slave protection
    </div>

    <!-- Import maps and Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from "three";
        import { OrbitControls } from "three/addons/controls/OrbitControls.js";
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- SYSTEM STATE WITH RESPONSIBLE CONTROL LOGIC ---
        // All devices obey master MCB: No power to downstream if MCB off.
        // Light and Fan only work if MCB is ON. Proper isolation.
        const state = {
            mcbOn: true,
            lightOn: false,
            fanOn: false,
            fanSpeed: 0,
            lightIntensity: 0,
        };

        // Store interactive objects
        const interactives = [];

        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050b1a);
        scene.fog = new THREE.FogExp2(0x050b1a, 0.006);
        
        const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(-9, 5.5, 22);
        camera.lookAt(0, 2.5, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ReinhardToneMapping;
        renderer.toneMappingExposure = 1.15;
        document.body.appendChild(renderer.domElement);
        
        // CSS2 Renderer for floating labels (non-intrusive)
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);
        
        // --- ORBIT CONTROLS (smooth, responsible interaction)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.07;
        controls.rotateSpeed = 1.2;
        controls.zoomSpeed = 1.0;
        controls.panSpeed = 0.8;
        controls.enableZoom = true;
        controls.enablePan = true;
        controls.target.set(0, 2.2, 0);
        
        // --- LIGHTING (ambient + directional, no performance hit)
        const ambientLight = new THREE.AmbientLight(0x40406c, 0.55);
        scene.add(ambientLight);
        
        const mainLight = new THREE.DirectionalLight(0xfff0e0, 0.9);
        mainLight.position.set(4, 12, 6);
        mainLight.castShadow = true;
        mainLight.receiveShadow = true;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        mainLight.shadow.camera.near = 0.5;
        mainLight.shadow.camera.far = 25;
        mainLight.shadow.camera.left = -8;
        mainLight.shadow.camera.right = 8;
        mainLight.shadow.camera.top = 8;
        mainLight.shadow.camera.bottom = -8;
        scene.add(mainLight);
        
        const fillLight = new THREE.PointLight(0x5577aa, 0.35);
        fillLight.position.set(3, 4, 5);
        scene.add(fillLight);
        
        const rimLight = new THREE.PointLight(0xffaa66, 0.25);
        rimLight.position.set(-2, 5, -6);
        scene.add(rimLight);
        
        // --- BACKGROUND DETAILS (floor grid, subtle environment)
        const gridHelper = new THREE.GridHelper(38, 24, 0x66aaff, 0x336699);
        gridHelper.position.y = -3.8;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.25;
        scene.add(gridHelper);
        
        const backPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(30, 18),
            new THREE.MeshStandardMaterial({ color: 0x111a2a, roughness: 0.7, metalness: 0.1, side: THREE.DoubleSide })
        );
        backPlane.position.set(0, 3, -5.8);
        backPlane.receiveShadow = true;
        scene.add(backPlane);
        
        // --- MATERIALS ---
        const matSwitchPlate = new THREE.MeshStandardMaterial({ color: 0xeef4ff, roughness: 0.3, metalness: 0.05 });
        const matMCBBody = new THREE.MeshStandardMaterial({ color: 0xddddff, roughness: 0.4 });
        const matLever = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.3 });
        const matBrass = new THREE.MeshStandardMaterial({ color: 0xcd9a5b, metalness: 0.7, roughness: 0.4 });
        const matGlass = new THREE.MeshPhysicalMaterial({ color: 0xfff5e0, transmission: 0.85, roughness: 0.12, thickness: 0.4, transparent: true });
        const matFanBody = new THREE.MeshStandardMaterial({ color: 0xc0c0d0, metalness: 0.55, roughness: 0.3 });
        
        // --- 1. MCB (Master Breaker) with responsible hierarchy ---
        const mcbGroup = new THREE.Group();
        const mcbBox = new THREE.Mesh(new THREE.BoxGeometry(2.6, 4.2, 1.4), matMCBBody);
        mcbBox.castShadow = true;
        mcbGroup.add(mcbBox);
        
        const mcbLeverObj = new THREE.Mesh(new THREE.BoxGeometry(0.85, 1.3, 0.55), matLever);
        mcbLeverObj.position.set(0, 0.5, 0.72);
        mcbLeverObj.rotation.x = -Math.PI / 4;
        mcbLeverObj.castShadow = true;
        mcbLeverObj.userData = { type: "mcb" };
        mcbGroup.add(mcbLeverObj);
        mcbGroup.position.set(-11.5, 1.3, -0.8);
        scene.add(mcbGroup);
        interactives.push(mcbLeverObj);
        
        // --- 2. Meter Box (visual only) ---
        const meterBox = new THREE.Group();
        const meterBody = new THREE.Mesh(new THREE.BoxGeometry(3.5, 4.5, 1.0), new THREE.MeshStandardMaterial({ color: 0x556677, roughness: 0.5 }));
        meterBody.castShadow = true;
        meterBox.add(meterBody);
        const meterScreen = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 1.6), new THREE.MeshStandardMaterial({ color: 0x112233, emissive: 0x113344, emissiveIntensity: 0.2 }));
        meterScreen.position.set(0, 0.9, 0.51);
        meterBox.add(meterScreen);
        const meterLedLight = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16), new THREE.MeshStandardMaterial({ color: 0xff3333, emissive: 0x440000 }));
        meterLedLight.position.set(-1.1, -1.2, 0.52);
        meterBox.add(meterLedLight);
        meterBox.position.set(-11.5, 8.2, -0.8);
        scene.add(meterBox);
        
        // --- 3. Switchboard (Light & Fan Controls) ---
        const switchboard = new THREE.Group();
        const boardBase = new THREE.Mesh(new THREE.BoxGeometry(10, 4.8, 0.7), matSwitchPlate);
        boardBase.castShadow = true;
        switchboard.add(boardBase);
        
        function createSwitchBtn(x, name, type) {
            const bg = new THREE.Mesh(new THREE.BoxGeometry(1.5, 2.0, 0.25), new THREE.MeshStandardMaterial({ color: 0xccccdd }));
            bg.position.set(x, 0, 0.42);
            bg.castShadow = true;
            switchboard.add(bg);
            const toggle = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.7, 0.2), new THREE.MeshStandardMaterial({ color: 0xfafaff }));
            toggle.position.set(x, 0, 0.61);
            toggle.rotation.x = -Math.PI / 12;
            toggle.name = name;
            toggle.castShadow = true;
            toggle.userData = { type: type };
            switchboard.add(toggle);
            return toggle;
        }
        
        const lightSwitch = createSwitchBtn(-2.8, "LIGHT_SW", "light");
        const fanSwitch = createSwitchBtn(2.0, "FAN_SW", "fan");
        switchboard.position.set(3.2, -2.3, -0.8);
        scene.add(switchboard);
        interactives.push(lightSwitch, fanSwitch);
        
        // --- 4. Enhanced Bulb with glow layers (responsible intensity) ---
        const bulbAssembly = new THREE.Group();
        const cord = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 2.6, 6), new THREE.MeshStandardMaterial({ color: 0x3a3a3a }));
        cord.position.y = 1.3;
        bulbAssembly.add(cord);
        
        const glassBulb = new THREE.Mesh(new THREE.SphereGeometry(1.25, 64, 64), matGlass);
        glassBulb.position.y = -0.9;
        glassBulb.castShadow = true;
        bulbAssembly.add(glassBulb);
        
        const filamentCore = new THREE.Mesh(new THREE.TorusGeometry(0.65, 0.055, 24, 48), new THREE.MeshStandardMaterial({ color: 0xff8855, emissive: 0xff4422, emissiveIntensity: 0 }));
        filamentCore.rotation.x = Math.PI / 2;
        filamentCore.position.y = -0.9;
        bulbAssembly.add(filamentCore);
        
        const innerGlowSphere = new THREE.Mesh(new THREE.SphereGeometry(0.58, 32, 32), new THREE.MeshStandardMaterial({ color: 0xffaa77, emissive: 0xff6622, emissiveIntensity: 0, transparent: true, opacity: 0.7 }));
        innerGlowSphere.position.y = -0.9;
        bulbAssembly.add(innerGlowSphere);
        
        const bulbCap = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.7, 0.55, 12), matBrass);
        bulbCap.position.y = -0.25;
        bulbAssembly.add(bulbCap);
        
        // Light sources inside bulb (dynamic)
        const pointLightBulb = new THREE.PointLight(0xffaa66, 0, 18, 1.8);
        pointLightBulb.castShadow = true;
        pointLightBulb.shadow.mapSize.width = 512;
        pointLightBulb.shadow.mapSize.height = 512;
        bulbAssembly.add(pointLightBulb);
        
        const haloGlowLight = new THREE.PointLight(0xff8844, 0, 14);
        bulbAssembly.add(haloGlowLight);
        
        // Sprite halo
        const haloCanvas = document.createElement('canvas');
        haloCanvas.width = 64;
        haloCanvas.height = 64;
        const ctx = haloCanvas.getContext('2d');
        ctx.fillStyle = 'rgba(0,0,0,0)';
        ctx.fillRect(0, 0, 64, 64);
        ctx.beginPath();
        ctx.arc(32, 32, 28, 0, 2 * Math.PI);
        ctx.fillStyle = '#ffaa55';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(32, 32, 16, 0, 2 * Math.PI);
        ctx.fillStyle = '#ffdd99';
        ctx.fill();
        const haloTexture = new THREE.CanvasTexture(haloCanvas);
        const spriteMat = new THREE.SpriteMaterial({ map: haloTexture, blending: THREE.AdditiveBlending, transparent: true, opacity: 0 });
        const haloSp = new THREE.Sprite(spriteMat);
        haloSp.scale.set(2.7, 2.7, 1);
        haloSp.position.y = -0.9;
        bulbAssembly.add(haloSp);
        
        bulbAssembly.position.set(0.2, 6.6, 1.8);
        scene.add(bulbAssembly);
        
        // --- 5. Ceiling Fan with proper rotation and speed control ---
        const fanGroup = new THREE.Group();
        fanGroup.position.set(7.8, 7.6, 1.2);
        const mountPlate = new THREE.Mesh(new THREE.CylinderGeometry(2.0, 2.0, 0.28, 8), new THREE.MeshStandardMaterial({ color: 0xbc9a6c, metalness: 0.4 }));
        mountPlate.position.y = 0;
        fanGroup.add(mountPlate);
        const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 1.9, 8), new THREE.MeshStandardMaterial({ color: 0xc0aa88, metalness: 0.5 }));
        rod.position.y = -1.1;
        fanGroup.add(rod);
        
        const rotorGroup = new THREE.Group();
        rotorGroup.position.y = -2.05;
        const motorHousing = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 1.8, 0.9, 24), matFanBody);
        motorHousing.castShadow = true;
        rotorGroup.add(motorHousing);
        
        const bladeMat = new THREE.MeshStandardMaterial({ color: 0xdcccaa, roughness: 0.6 });
        for (let i = 0; i < 4; i++) {
            const bladeGroup = new THREE.Group();
            const arm = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.12, 1.2), new THREE.MeshStandardMaterial({ color: 0xaa9988 }));
            arm.position.set(1.35, 0.1, 0);
            bladeGroup.add(arm);
            const blade = new THREE.Mesh(new THREE.BoxGeometry(4.0, 0.07, 1.3), bladeMat);
            blade.position.set(3.3, 0.1, 0);
            blade.castShadow = true;
            bladeGroup.add(blade);
            bladeGroup.rotation.y = i * Math.PI / 2;
            rotorGroup.add(bladeGroup);
        }
        const centerCapFan = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 0.95, 0.22, 8), new THREE.MeshStandardMaterial({ color: 0xb59a6e }));
        centerCapFan.position.y = 0.25;
        rotorGroup.add(centerCapFan);
        fanGroup.add(rotorGroup);
        scene.add(fanGroup);
        
        // Additional small decorative wires for immersion (non-intrusive)
        const wirePoints = [
            [new THREE.Vector3(-11.5, 6.5, -0.5), new THREE.Vector3(-11.5, 3.2, -0.5), new THREE.Vector3(-9, 0.5, -0.5)],
            [new THREE.Vector3(-9, 0.5, -0.5), new THREE.Vector3(-4, -1.5, -0.5), new THREE.Vector3(0.2, 0.5, 1.3)],
            [new THREE.Vector3(-9, 0.5, -0.5), new THREE.Vector3(-1, 0, -0.5), new THREE.Vector3(6.5, 5.2, 1.0)]
        ];
        const wireMat = new THREE.MeshStandardMaterial({ color: 0xaa5555, roughness: 0.4 });
        wirePoints.forEach(points => {
            const curve = new THREE.CatmullRomCurve3(points);
            const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 28, 0.09, 6, false), wireMat);
            tube.castShadow = true;
            scene.add(tube);
        });
        
        // Floating particles ambiance (low cost)
        const particleCount = 400;
        const particleGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
            positions[i*3] = (Math.random() - 0.5) * 45;
            positions[i*3+1] = (Math.random() - 0.5) * 14;
            positions[i*3+2] = (Math.random() - 0.5) * 18 - 6;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particleMat = new THREE.PointsMaterial({ color: 0x77aaff, size: 0.05, transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending });
        const particlesSys = new THREE.Points(particleGeo, particleMat);
        scene.add(particlesSys);
        
        // --- UI Update Helper ---
        function updateUI() {
            document.getElementById("mcb-status").innerText = state.mcbOn ? "ON" : "OFF";
            document.getElementById("mcb-status").className = "indicator " + (state.mcbOn ? "on" : "off");
            document.getElementById("light-status").innerText = state.lightOn ? "ON" : "OFF";
            document.getElementById("light-status").className = "indicator " + (state.lightOn ? "on" : "off");
            document.getElementById("fan-status").innerText = state.fanOn ? "ON" : "OFF";
            document.getElementById("fan-status").className = "indicator " + (state.fanOn ? "on" : "off");
        }
        
        // --- Interaction Handler with Responsible Logic: Respect MCB Master ---
        function operateDevice(type, switchObj) {
            if (type === "mcb") {
                state.mcbOn = !state.mcbOn;
                // update lever rotation visual
                switchObj.rotation.x = state.mcbOn ? -Math.PI / 4 : Math.PI / 4;
                // If MCB turns OFF, force downstream devices OFF and reflect UI
                if (!state.mcbOn) {
                    if (state.lightOn) {
                        state.lightOn = false;
                        if (lightSwitch) lightSwitch.rotation.x = -Math.PI / 12;
                    }
                    if (state.fanOn) {
                        state.fanOn = false;
                        if (fanSwitch) fanSwitch.rotation.x = -Math.PI / 12;
                    }
                }
                updateUI();
                return;
            }
            
            // For light or fan: only allowed if MCB is ON
            if (!state.mcbOn) {
                // Cannot turn on if master is off, just ignore click (optional subtle effect)
                return;
            }
            
            if (type === "light") {
                state.lightOn = !state.lightOn;
                switchObj.rotation.x = state.lightOn ? Math.PI / 12 : -Math.PI / 12;
            } else if (type === "fan") {
                state.fanOn = !state.fanOn;
                switchObj.rotation.x = state.fanOn ? Math.PI / 12 : -Math.PI / 12;
            }
            updateUI();
        }
        
        // Raycaster for clicks
        const raycaster = new THREE.Raycaster();
        const mouseVec = new THREE.Vector2();
        
        window.addEventListener("click", (event) => {
            mouseVec.x = (event.clientX / renderer.domElement.clientWidth) * 2 - 1;
            mouseVec.y = -(event.clientY / renderer.domElement.clientHeight) * 2 + 1;
            raycaster.setFromCamera(mouseVec, camera);
            const hits = raycaster.intersectObjects(interactives);
            if (hits.length > 0) {
                const hitObj = hits[0].object;
                const devType = hitObj.userData.type;
                operateDevice(devType, hitObj);
            }
        });
        
        // Cursor pointer on hover
        window.addEventListener("mousemove", (event) => {
            mouseVec.x = (event.clientX / renderer.domElement.clientWidth) * 2 - 1;
            mouseVec.y = -(event.clientY / renderer.domElement.clientHeight) * 2 + 1;
            raycaster.setFromCamera(mouseVec, camera);
            const intersects = raycaster.intersectObjects(interactives);
            renderer.domElement.style.cursor = intersects.length ? "pointer" : "default";
        });
        
        // --- Animation & Smooth Parameter Updates ---
        let lastTimestamp = performance.now();
        let currentFanRot = 0;
        
        function animate() {
            const now = performance.now();
            let delta = Math.min(0.033, (now - lastTimestamp) / 1000);
            lastTimestamp = now;
            
            const power = state.mcbOn;
            const lightActive = power && state.lightOn;
            const fanActive = power && state.fanOn;
            
            // Smooth light intensity transitions
            const targetIntensity = lightActive ? 1.65 : 0;
            state.lightIntensity += (targetIntensity - state.lightIntensity) * 0.18;
            
            // Update bulb lighting
            pointLightBulb.intensity = state.lightIntensity * 19;
            haloGlowLight.intensity = state.lightIntensity * 4.2;
            if (filamentCore.material) filamentCore.material.emissiveIntensity = state.lightIntensity * 0.95;
            innerGlowSphere.material.emissiveIntensity = state.lightIntensity * 0.75;
            innerGlowSphere.material.opacity = 0.4 + state.lightIntensity * 0.5;
            if (glassBulb.material) {
                glassBulb.material.emissiveIntensity = state.lightIntensity * 0.35;
                glassBulb.material.color.setHex(lightActive ? 0xffeebb : 0xffeedd);
            }
            spriteMat.opacity = state.lightIntensity * 0.65;
            const haloScaleVal = 2.2 + state.lightIntensity * 1.8;
            haloSp.scale.set(haloScaleVal, haloScaleVal, 1);
            
            // Fan Rotation Dynamics
            if (fanActive) {
                state.fanSpeed = Math.min(state.fanSpeed + delta * 0.55, 0.28);
            } else {
                state.fanSpeed = Math.max(state.fanSpeed - delta * 0.9, 0);
            }
            if (rotorGroup) {
                rotorGroup.rotation.y += state.fanSpeed * delta * 32;
            }
            
            // Meter LED blink when MCB ON
            if (meterLedLight && meterLedLight.material) {
                if (power) {
                    const blink = Math.sin(Date.now() * 0.012) > 0;
                    meterLedLight.material.color.setHex(blink ? 0xff5555 : 0x881111);
                    meterLedLight.material.emissiveIntensity = blink ? 0.7 : 0.1;
                } else {
                    meterLedLight.material.color.setHex(0x331111);
                    meterLedLight.material.emissiveIntensity = 0;
                }
            }
            
            // particle ambiance
            particlesSys.rotation.y += 0.0015;
            particlesSys.rotation.x += 0.0008;
            if (lightActive) {
                particleMat.color.setHex(0xffaa77);
                particleMat.opacity = 0.5;
            } else {
                particleMat.color.setHex(0x88aaff);
                particleMat.opacity = 0.3;
            }
            
            // slight rotation for meter screen
            if (meterScreen && meterScreen.material) {
                meterScreen.material.emissiveIntensity = power ? 0.35 : 0.05;
            }
            
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        
        window.addEventListener("resize", onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // Initial UI sync
        updateUI();
        animate();
        
        console.log("3D Electrical System: Responsible control logic active | MCB master lock | Smooth glow & fan");
    </script>
</body>
</html>

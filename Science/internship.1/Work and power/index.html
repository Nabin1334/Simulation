<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Simulation: Work & Power</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; overflow: hidden; display: flex; flex-direction: column; height: 100vh; background: #1a1a1a; }
        #controls { padding: 15px; background: #2c3e50; color: white; display: flex; gap: 20px; align-items: center; justify-content: center; flex-wrap: wrap; z-index: 10; border-bottom: 2px solid #34495e; }
        #three-container { flex-grow: 1; width: 100%; position: relative; }
        .input-group { display: flex; flex-direction: column; font-size: 11px; color: #ecf0f1; }
        input { width: 65px; padding: 5px; border-radius: 4px; border: none; margin-top: 3px; text-align: center; background: #ecf0f1; color: #333; font-weight: bold; }
        .formula-box { background: rgba(0,0,0,0.3); padding: 5px 15px; border-radius: 8px; border: 1px solid #555; text-align: center; min-width: 100px; }
        .output { font-weight: bold; color: #2ecc71; font-size: 16px; }
        button { padding: 8px 20px; cursor: pointer; border-radius: 4px; border: none; font-weight: bold; text-transform: uppercase; transition: 0.2s; }
        #start-btn { background: #27ae60; color: white; }
        #stop-btn { background: #e74c3c; color: white; }
        #reset-btn { background: #95a5a6; color: white; }
        button:disabled { opacity: 0.3; cursor: not-allowed; }
        #time-display { font-weight: bold; }
    </style>
</head>
<body>

<div id="controls">
    <div class="input-group"><label>FORCE (N)</label><input type="number" id="force-input" value="50"></div>
    <div class="input-group"><label>DIST (m)</label><input type="number" id="distance-input" value="20"></div>
    
    <div class="formula-box">
        <div style="font-size: 10px; color: #aaa;">W = F × d</div>
        WORK: <span id="work-output" class="output">0</span> J
    </div>
    <div class="formula-box">
        <div style="font-size: 10px; color: #aaa;">P = W / t</div>
        POWER: <span id="power-output" class="output">0</span> W
    </div>

    <div style="font-size: 12px; color: #2ecc71;">Time: <span id="time-display">0.0</span>s</div>

    <button id="start-btn">Start Push</button>
    <button id="stop-btn" disabled>Stop</button>
    <button id="reset-btn">Reset</button>
</div>

<div id="three-container"></div>

<script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnetic Field Simulation (Three.js)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; color: white; font-family: sans-serif; }
        #info { position: absolute; top: 10px; width: 100%; text-align: center; pointer-events: none; }
    </style>
</head>
<body>
    <div id="info">
        <h3>Magnetic Field & Poles</h3>
        <p>Left Click: Rotate | Right Click: Pan | Scroll: Zoom</p>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- Configuration (Matches your p5.js variables) ---
        const config = {
            l: 100,           // Magnet length
            w: 40,            // Magnet width (and depth)
            poleStrength: 5000, // Adjusted scale for Three.js units
            stepSize: 2,
            maxSteps: 500,    // Increased slightly for smoother curves
            radii: [5, 15, 25, 35], // Starting offsets
            numAngles: 16     // Lines per ring
        };

        let scene, camera, renderer, controls, labelRenderer;

        function init() {
            // 1. Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111); // Dark background
            scene.fog = new THREE.FogExp2(0x111111, 0.002);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.set(150, 100, 200);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // CSS2 renderer for text labels (always facing camera)
            labelRenderer = new CSS2DRenderer();
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.domElement.style.position = 'absolute';
            labelRenderer.domElement.style.top = '0px';
            labelRenderer.domElement.style.left = '0px';
            labelRenderer.domElement.style.pointerEvents = 'none';
            document.body.appendChild(labelRenderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // 2. Lighting
            const ambient = new THREE.AmbientLight(0x404040);
            scene.add(ambient);
            const light = new THREE.DirectionalLight(0xffffff, 2);
            light.position.set(50, 50, 50);
            scene.add(light);

            // 3. Create Magnet
            createMagnet();

            // 4. Generate Field Lines
            generateFieldLines();

            // 5. Start Loop
            animate();
        }

        function createMagnet() {
            const magnetGroup = new THREE.Group();

            const geometry = new THREE.BoxGeometry(config.w, config.l / 2, config.w);

            // North Pole (Red) - Top
            const northMat = new THREE.MeshStandardMaterial({ color: 0xff0000, roughness: 0.4 });
            const northMesh = new THREE.Mesh(geometry, northMat);
            northMesh.position.y = config.l / 4;
            
            // South Pole (White/Blue) - Bottom
            // Using Blue as it is standard for Physics 3D, but you can change to 0xffffff for White
            const southMat = new THREE.MeshStandardMaterial({ color: 0x3333ff, roughness: 0.4 });
            const southMesh = new THREE.Mesh(geometry, southMat);
            southMesh.position.y = -config.l / 4;

            magnetGroup.add(northMesh);
            magnetGroup.add(southMesh);
            scene.add(magnetGroup);

            // --- ADD N AND S LABELS (NO OTHER CHANGES) ---
            // Create North Pole label "N"
            const northDiv = document.createElement('div');
            northDiv.textContent = 'N';
            northDiv.style.color = '#ff6666';
            northDiv.style.fontSize = '48px';
            northDiv.style.fontWeight = 'bold';
            northDiv.style.fontFamily = 'Arial, sans-serif';
            northDiv.style.textShadow = '0 0 15px rgba(255,0,0,0.9)';
            northDiv.style.background = 'rgba(0,0,0,0.65)';
            northDiv.style.padding = '6px 18px';
            northDiv.style.borderRadius = '50px';
            northDiv.style.border = '2px solid #ff6666';
            northDiv.style.backdropFilter = 'blur(4px)';
            northDiv.style.letterSpacing = '1px';
            
            const northLabel = new CSS2DObject(northDiv);
            northLabel.position.set(0, config.l / 2 + 12, 0);
            scene.add(northLabel);
            
            // Create South Pole label "S"
            const southDiv = document.createElement('div');
            southDiv.textContent = 'S';
            southDiv.style.color = '#88aaff';
            southDiv.style.fontSize = '48px';
            southDiv.style.fontWeight = 'bold';
            southDiv.style.fontFamily = 'Arial, sans-serif';
            southDiv.style.textShadow = '0 0 15px rgba(51,102,255,0.9)';
            southDiv.style.background = 'rgba(0,0,0,0.65)';
            southDiv.style.padding = '6px 18px';
            southDiv.style.borderRadius = '50px';
            southDiv.style.border = '2px solid #6688ff';
            southDiv.style.backdropFilter = 'blur(4px)';
            southDiv.style.letterSpacing = '1px';
            
            const southLabel = new CSS2DObject(southDiv);
            southLabel.position.set(0, -config.l / 2 - 12, 0);
            scene.add(southLabel);
        }

        // --- Physics Logic (Ported from your getB function) ---
        function getB(position) {
            const northPolePos = new THREE.Vector3(0, config.l / 2, 0);
            const southPolePos = new THREE.Vector3(0, -config.l / 2, 0);

            // Vector from North Pole to current position
            const rN = new THREE.Vector3().subVectors(position, northPolePos);
            const distN = rN.length();
            
            // Vector from South Pole to current position
            const rS = new THREE.Vector3().subVectors(position, southPolePos);
            const distS = rS.length();

            // Avoid division by zero
            if (distN < 0.1 || distS < 0.1) return new THREE.Vector3(0, 0, 0);

            // Calculate Field contribution from North (+)
            // B = k * q / r^3 * vec(r)  (This results in 1/r^2 magnitude)
            const magN = config.poleStrength / Math.pow(distN, 3);
            const Bn = rN.multiplyScalar(magN);

            // Calculate Field contribution from South (-)
            const magS = -config.poleStrength / Math.pow(distS, 3);
            const Bs = rS.multiplyScalar(magS);

            // Resultant Vector
            return new THREE.Vector3().addVectors(Bn, Bs);
        }

        function generateFieldLines() {
            const material = new THREE.LineBasicMaterial({ 
                color: 0x00ffff, // Cyan lines
                opacity: 0.5, 
                transparent: true 
            });

            // Loop through concentric rings
            config.radii.forEach(r => {
                // Loop through angles around the circle
                for (let i = 0; i < config.numAngles; i++) {
                    const theta = (i / config.numAngles) * Math.PI * 2;
                    
                    // Starting position (Top of North pole + offset)
                    const x = r * Math.cos(theta);
                    const z = r * Math.sin(theta);
                    const startPos = new THREE.Vector3(x, (config.l / 2) + 1, z);

                    // Trace the line
                    const points = traceLine(startPos);
                    
                    // Create Geometry from points
                    const geometry = new THREE.BufferGeometry().setFromPoints(points);
                    const line = new THREE.Line(geometry, material);
                    scene.add(line);
                }
            });
        }

        function traceLine(startPos) {
            const points = [];
            let pos = startPos.clone();
            points.push(pos.clone());

            for (let step = 0; step < config.maxSteps; step++) {
                const B = getB(pos);
                
                // If field is negligible, stop
                if (B.lengthSq() < 0.0001) break;

                // Normalize B and scale by stepSize
                const dir = B.normalize().multiplyScalar(config.stepSize);
                pos.add(dir);
                points.push(pos.clone());

                // Stop conditions
                
                // 1. Hit the South Pole? (Distance check)
                const distToSouth = pos.distanceTo(new THREE.Vector3(0, -config.l/2, 0));
                // We stop if we get inside the magnet geometry roughly
                if (distToSouth < config.w / 1.5) break;

                // 2. Too far away?
                if (pos.length() > 300) break;
            }
            return points;
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            // Render CSS2D labels (N and S)
            labelRenderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Initialize
        init();

    </script>
</body>
</html>

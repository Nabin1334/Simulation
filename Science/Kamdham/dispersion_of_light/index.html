<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real prism · simple light pass</title>
    <style>
        /* ABSOLUTELY SIMPLE — REALISTIC, NO DISTRACTIONS */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1e2c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: system-ui, 'Inter', sans-serif;
            padding: 20px;
        }

        .real-card {
            max-width: 1000px;
            width: 100%;
            background: #0e121c;
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.7);
            border: 1px solid #384b64;
        }

        .title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            color: white;
            flex-wrap: wrap;
        }

        .title h2 {
            font-weight: 450;
            font-size: 1.8rem;
            letter-spacing: -0.5px;
        }

        .title span {
            background: #2a3f5a;
            padding: 6px 18px;
            border-radius: 40px;
            color: #d2ecff;
            font-size: 0.95rem;
            border-left: 4px solid #99d6ff;
        }

        /* CANVAS — CLEAN, DARK, REALISTIC */
        .canvas-holder {
            background: #080b12;
            border-radius: 16px;
            padding: 4px;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 12px;
            background: #0a0e16;
            cursor: pointer;
        }

        /* MINIMAL CONTROLS */
        .actions {
            display: flex;
            gap: 16px;
            margin: 20px 0 16px 0;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            background: #25344a;
            border: none;
            border-bottom: 3px solid #4f7a9e;
            color: white;
            padding: 10px 26px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.05s;
        }

        .btn:hover {
            background: #314e6e;
            border-bottom-color: #90c8ff;
        }

        .status {
            background: #1a2537;
            padding: 8px 24px;
            border-radius: 40px;
            color: #c4e0ff;
            display: flex;
            gap: 24px;
            border: 1px solid #4e779b;
        }

        /* SPECTRUM — REAL COLORS, NO TEXT OVERLOAD */
        .spectrum {
            display: flex;
            height: 36px;
            margin: 20px 0 0 0;
            border-radius: 40px;
            overflow: hidden;
            border: 1px solid #567c9c;
            opacity: 0.9;
        }

        .spectrum div {
            flex: 1;
        }

        /* SIMPLE INFO */
        .real-note {
            display: flex;
            justify-content: space-between;
            margin-top: 18px;
            color: #b0cce0;
            font-size: 0.9rem;
            padding: 0 6px;
            flex-wrap: wrap;
        }

        .key {
            background: #1f2c3c;
            padding: 4px 12px;
            border-radius: 20px;
            color: #cde1ff;
        }

        footer {
            text-align: center;
            margin-top: 24px;
            color: #7b98b3;
            font-size: 0.85rem;
        }

        /* no animations, no blinking — pure */
    </style>
</head>
<body>
    <div class="real-card">
        <!-- HEADER — PLAIN -->
        <div class="title">
            <h2>🔷 prism · real pass</h2>
            <span>light → spectrum</span>
        </div>

        <!-- CANVAS — REALISTIC LIGHT TRAVEL -->
        <div class="canvas-holder">
            <canvas id="prismCanvas" width="1000" height="460"></canvas>
        </div>

        <!-- SIMPLE BUTTONS -->
        <div class="actions">
            <button class="btn" id="playBtn"><span>▶</span> play</button>
            <button class="btn" id="resetBtn"><span>↺</span> reset</button>
            <div class="status">
                <span id="phaseText">⚡ entering</span>
                <span id="progressText">0%</span>
            </div>
        </div>

        <!-- REAL SPECTRUM — NO LABELS, JUST COLOR -->
        <div class="spectrum">
            <div style="background:#ff3a3a;"></div>
            <div style="background:#ff8c1a;"></div>
            <div style="background:#ffe600;"></div>
            <div style="background:#33dd33;"></div>
            <div style="background:#3399ff;"></div>
            <div style="background:#6a4ec7;"></div>
            <div style="background:#c45aff;"></div>
        </div>

        <!-- MINIMAL FOOTER -->
        <div class="real-note">
            <span>⬩ white light enters ➔ bends ➔ splits</span>
            <span class="key">␣ pause · R reset</span>
        </div>
        <footer>realistic refraction · simple path</footer>
    </div>

    <script>
        // --------------------------------------------------------
        // REALISTIC, SIMPLE LIGHT PASS THROUGH PRISM
        // NO fake glow, NO overdone effects — just clear, real beam
        // --------------------------------------------------------

        const canvas = document.getElementById('prismCanvas');
        const ctx = canvas.getContext('2d');
        const phaseText = document.getElementById('phaseText');
        const progressText = document.getElementById('progressText');
        const playBtn = document.getElementById('playBtn');
        const resetBtn = document.getElementById('resetBtn');

        // ---------- FIXED, CLEAN DIMENSIONS ----------
        let w, h, cx, cy, prismSize;

        function setSize() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = Math.max(900, rect.width || 1000);
            canvas.height = 460;
            w = canvas.width;
            h = canvas.height;
            cx = w * 0.5;
            cy = h * 0.58;
            prismSize = Math.min(w * 0.2, 160);
        }

        // ---------- REAL SPECTRAL COLORS (VIBGYOR) ----------
        const spectrumColors = [
            { name: 'red', hex: '#ff3a3a', angle: -0.38 },
            { name: 'orange', hex: '#ff8c1a', angle: -0.24 },
            { name: 'yellow', hex: '#ffe600', angle: -0.10 },
            { name: 'green', hex: '#33dd33', angle: 0.06 },
            { name: 'blue', hex: '#3399ff', angle: 0.22 },
            { name: 'indigo', hex: '#6a4ec7', angle: 0.34 },
            { name: 'violet', hex: '#c45aff', angle: 0.46 }
        ];

        // ---------- ANIMATION STATE (simple) ----------
        let phase = 0;        // 0:ready, 1:to prism, 2:inside, 3:exit, 4:spectrum
        let progress = 0.0;
        let playing = true;
        let animFrame;

        // ---------- RESET (clean start) ----------
        function resetSim() {
            phase = 0;
            progress = 0.0;
            playing = true;
            phaseText.innerText = '⚡ entering';
            progressText.innerText = '0%';
            playBtn.innerHTML = '<span>⏸</span> pause';
            drawScene();
        }

        // ---------- TOGGLE PLAY ----------
        function togglePlay() {
            playing = !playing;
            playBtn.innerHTML = playing ? '<span>⏸</span> pause' : '<span>▶</span> play';
            if (playing) animate();
        }

        // ---------- EVENT LISTENERS (simple) ----------
        playBtn.addEventListener('click', togglePlay);
        resetBtn.addEventListener('click', resetSim);
        canvas.addEventListener('click', togglePlay);
        canvas.addEventListener('dblclick', (e) => { e.preventDefault(); resetSim(); });

        document.addEventListener('keydown', (e) => {
            if (e.key === ' ') { e.preventDefault(); togglePlay(); }
            if (e.key === 'r' || e.key === 'R') resetSim();
        });

        // ---------- DRAW — REALISTIC, CLEAN, MINIMAL ----------
        function drawScene() {
            if (!w || !h) setSize();
            ctx.clearRect(0, 0, w, h);

            // soft dark background (realistic)
            ctx.fillStyle = '#0c101a';
            ctx.fillRect(0, 0, w, h);

            // ---------- PRISM — clean, subtle ----------
            ctx.beginPath();
            ctx.moveTo(cx, cy - prismSize * 0.8);
            ctx.lineTo(cx - prismSize * 0.85, cy + prismSize * 0.55);
            ctx.lineTo(cx + prismSize * 0.85, cy + prismSize * 0.55);
            ctx.closePath();

            // transparent prism – only edges visible
            ctx.fillStyle = 'rgba(25, 35, 55, 0.2)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(200, 225, 255, 0.5)';
            ctx.lineWidth = 1.6;
            ctx.stroke();

            // simple label
            ctx.font = '14px "Inter", system-ui, sans-serif';
            ctx.fillStyle = '#a0bedb';
            ctx.textAlign = 'center';
            ctx.fillText('prism', cx, cy + prismSize * 0.8);

            // ---------- LIGHT SOURCE (small, clean) ----------
            const srcX = cx - prismSize * 1.9;
            const srcY = cy - 8;

            ctx.beginPath();
            ctx.arc(srcX, srcY, 9, 0, 2 * Math.PI);
            ctx.fillStyle = '#fffef0';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#ffeebb';
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ffffff';
            ctx.font = '12px "Inter"';
            ctx.fillText('white', srcX-20, srcY-25);

            // ---------- PHASE 1: BEAM TO PRISM ----------
            if (phase >= 1) {
                let enter = (phase === 1) ? Math.min(progress, 1.0) : 1.0;
                const entryX = cx - prismSize * 0.5;
                const entryY = srcY;
                const beamEndX = srcX + (entryX - srcX) * enter;

                ctx.beginPath();
                ctx.moveTo(srcX, srcY);
                ctx.lineTo(beamEndX, srcY);
                ctx.strokeStyle = 'rgba(255, 255, 245, 0.9)';
                ctx.lineWidth = 5;
                ctx.shadowBlur = 18;
                ctx.shadowColor = '#fffde7';
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            // ---------- PHASE 2 & 3: LIGHT PASS INSIDE PRISM (REAL, CLEAR) ----------
            if (phase >= 2) {
                // fixed geometry – realistic path through prism
                const entryX = cx - prismSize * 0.5;
                const entryY = cy - 8;
                const bendX = cx;
                const bendY = cy - prismSize * 0.28;
                const exitX = cx + prismSize * 0.55;
                const exitY = cy - 5;

                // ---------- PHASE 2: entry → bend ----------
                if (phase === 2) {
                    let prog = Math.min(progress, 1.0);
                    let currX = entryX + (bendX - entryX) * prog;
                    let currY = entryY + (bendY - entryY) * prog;

                    // beam entry→current (clean, visible)
                    ctx.beginPath();
                    ctx.moveTo(entryX, entryY);
                    ctx.lineTo(currX, currY);
                    ctx.strokeStyle = '#fffee7';
                    ctx.lineWidth = 6.5;
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = '#ffe694';
                    ctx.stroke();

                    // small dot at tip
                    ctx.beginPath();
                    ctx.arc(currX, currY, 4, 0, 2 * Math.PI);
                    ctx.fillStyle = '#fffff0';
                    ctx.shadowBlur = 16;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }

                // ---------- PHASE 3: bend → exit (full entry→bend + moving exit) ----------
                if (phase === 3) {
                    let prog = Math.min(progress, 1.0);
                    let currX = bendX + (exitX - bendX) * prog;
                    let currY = bendY + (exitY - bendY) * prog;

                    // full entry→bend (already there)
                    ctx.beginPath();
                    ctx.moveTo(entryX, entryY);
                    ctx.lineTo(bendX, bendY);
                    ctx.strokeStyle = '#fffee7';
                    ctx.lineWidth = 6.5;
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = '#ffe694';
                    ctx.stroke();

                    // moving bend→exit
                    ctx.beginPath();
                    ctx.moveTo(bendX, bendY);
                    ctx.lineTo(currX, currY);
                    ctx.strokeStyle = '#fffee7';
                    ctx.lineWidth = 6.5;
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = '#ffe694';
                    ctx.stroke();

                    // tip
                    ctx.beginPath();
                    ctx.arc(currX, currY, 4.5, 0, 2 * Math.PI);
                    ctx.fillStyle = '#fffff0';
                    ctx.shadowBlur = 18;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }

                // ---------- PHASE 4: full inside path complete ----------
                if (phase >= 4) {
                    // draw entire path through prism (steady, realistic)
                    ctx.beginPath();
                    ctx.moveTo(entryX, entryY);
                    ctx.lineTo(bendX, bendY);
                    ctx.lineTo(exitX, exitY);
                    ctx.strokeStyle = '#fffee0';
                    ctx.lineWidth = 6.5;
                    ctx.shadowBlur = 22;
                    ctx.shadowColor = '#ffdb8c';
                    ctx.stroke();
                    ctx.shadowBlur = 0;

                    // exit dot
                    ctx.beginPath();
                    ctx.arc(exitX, exitY, 5, 0, 2 * Math.PI);
                    ctx.fillStyle = '#ffffea';
                    ctx.shadowBlur = 18;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }

            // ---------- PHASE 4/5: DISPERSION (REAL SPECTRUM) ----------
            if (phase >= 4) {
                const exitX = cx + prismSize * 0.55;
                const exitY = cy - 5;
                let exitProg = (phase === 4) ? Math.min(progress, 1.0) : 1.0;

                spectrumColors.forEach((color, i) => {
                    let delay = i * 0.055;
                    let strength = Math.max(0, Math.min(1, (exitProg - delay) * 1.6));
                    if (strength <= 0) return;

                    let yOff = color.angle * 150 * strength;
                    let endX = exitX + 140 * strength + 20;
                    let endY = exitY + yOff;

                    ctx.beginPath();
                    ctx.moveTo(exitX, exitY);
                    ctx.lineTo(endX, endY);
                    ctx.strokeStyle = color.hex;
                    ctx.lineWidth = 4.5;
                    ctx.shadowBlur = 14;
                    ctx.shadowColor = color.hex;
                    ctx.stroke();
                });
                ctx.shadowBlur = 0;
            }

            // tiny real label: direction
            ctx.font = '11px monospace';
            ctx.fillStyle = '#99bbdd';
            ctx.textAlign = 'left';
            ctx.fillText('← source', 20, h-30);
            ctx.fillStyle = '#ddccaa';
            ctx.fillText('prism →', cx+30, h-30);
        }

        // ---------- ANIMATION (simple timing) ----------
        function animate() {
            if (!playing) {
                drawScene();
                animFrame = requestAnimationFrame(animate);
                return;
            }

            // state machine – clean transitions
            if (phase === 0) { phase = 1; progress = 0.0; }
            else if (phase === 1) { progress += 0.0052; if (progress >= 1.0) { progress = 0.0; phase = 2; } }
            else if (phase === 2) { progress += 0.0052; if (progress >= 1.0) { progress = 0.0; phase = 3; } }
            else if (phase === 3) { progress += 0.0052; if (progress >= 1.0) { progress = 0.0; phase = 4; } }
            else if (phase === 4) { progress += 0.0048; if (progress >= 1.0) progress = 1.0; }

            // update text – minimal
            if (phase === 1) phaseText.innerText = '⚡ entering';
            else if (phase === 2) phaseText.innerText = '✨ inside prism';
            else if (phase === 3) phaseText.innerText = '✨ traveling';
            else if (phase === 4) phaseText.innerText = '🌈 spectrum';
            
            let per = 0;
            if (phase === 1) per = Math.floor(progress * 100);
            else if (phase === 2) per = Math.floor(progress * 100);
            else if (phase === 3) per = Math.floor(progress * 100);
            else if (phase === 4) per = Math.floor(progress * 100);
            progressText.innerText = per + '%';

            drawScene();
            animFrame = requestAnimationFrame(animate);
        }

        // ---------- INIT ----------
        window.addEventListener('load', () => {
            setSize();
            resetSim();
            animate();
        });
        window.addEventListener('resize', () => { setSize(); drawScene(); });
    </script>
</body>
</html>

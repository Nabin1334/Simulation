<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Electric Circuit Lab</title>
    <style>
      :root {
        --bg-color: #121212;
        --panel-bg: rgba(30, 30, 35, 0.8);
        --accent-color: #00e5ff;
        --danger-color: #ff3d00;
        --success-color: #00c853;
        --text-primary: #e0e0e0;
        --text-secondary: #a0a0a0;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }

      body {
        background-color: var(--bg-color);
        background-image: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #000000 100%);
        color: var(--text-primary);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        overflow-x: hidden;
      }

      /* Header Styling */
      header {
        text-align: center;
        margin-bottom: 30px;
        position: relative;
        z-index: 2;
      }

      h1 {
        font-weight: 300;
        font-size: 2.5rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        background: linear-gradient(90deg, #fff, var(--accent-color));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 10px;
      }

      .subtitle {
        color: var(--text-secondary);
        font-size: 1rem;
      }

      /* Main Layout */
      .lab-bench {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        width: 100%;
        max-width: 1200px;
        justify-content: center;
      }

      /* Canvas Container */
      .simulation-area {
        flex: 2;
        min-width: 600px;
        background: #1a1a1a;
        border-radius: 12px;
        border: 1px solid #333;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.5) inset;
        position: relative;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      canvas {
        background: transparent;
        cursor: crosshair;
        max-width: 100%;
      }

      /* Controls & Info Panel */
      .control-panel {
        flex: 1;
        min-width: 300px;
        background: var(--panel-bg);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 25px;
        display: flex;
        flex-direction: column;
        gap: 25px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }

      .panel-section h2 {
        font-size: 1.1rem;
        color: var(--accent-color);
        margin-bottom: 15px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding-bottom: 5px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      /* Digital Multimeter Display */
      .multimeter {
        background: #000;
        border: 2px solid #333;
        border-radius: 8px;
        padding: 15px;
        font-family: 'Courier New', monospace;
        color: var(--success-color);
        text-shadow: 0 0 5px var(--success-color);
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .reading {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .reading label {
        font-size: 0.7rem;
        color: #555;
        margin-bottom: 2px;
      }

      .reading span {
        font-size: 1.4rem;
      }

      /* Status Indicator */
      .status-box {
        display: flex;
        align-items: center;
        gap: 15px;
        background: rgba(255, 255, 255, 0.05);
        padding: 15px;
        border-radius: 8px;
      }

      .led {
        width: 15px;
        height: 15px;
        border-radius: 50%;
        background-color: #333;
        box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
        transition: all 0.3s;
      }

      .led.on {
        background-color: var(--success-color);
        box-shadow: 0 0 10px var(--success-color);
      }

      .led.off {
        background-color: var(--danger-color);
        box-shadow: 0 0 10px var(--danger-color);
      }

      .status-text {
        font-weight: bold;
        font-size: 0.9rem;
      }

      /* Switch Button */
      .toggle-btn {
        width: 100%;
        padding: 15px;
        background: linear-gradient(135deg, #2c3e50, #000);
        border: 1px solid #444;
        color: white;
        font-size: 1rem;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
        transition: transform 0.1s, box-shadow 0.1s;
        box-shadow: 0 4px 0 #111;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .toggle-btn:hover {
        background: linear-gradient(135deg, #34495e, #111);
      }

      .toggle-btn:active {
        transform: translateY(4px);
        box-shadow: 0 0 0 #111;
      }

      /* Legend */
      .legend {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        font-size: 0.85rem;
        color: var(--text-secondary);
      }
      
      .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .dot-legend {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #4fc3f7;
      }

      /* Footer */
      footer {
        margin-top: 30px;
        font-size: 0.8rem;
        color: #555;
      }

      @media (max-width: 900px) {
        .simulation-area { min-width: 100%; }
        .lab-bench { flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1> Electric Circuit of light bulbs
</h1>
      <p class="subtitle">Physics-Accurate DC Circuit Simulator</p>
    </header>

    <div class="lab-bench">
      <div class="simulation-area">
        <canvas id="circuitCanvas" width="800" height="500"></canvas>
      </div>

      <div class="control-panel">
        <div class="panel-section">
          <h2>Multimeter</h2>
          <div class="multimeter">
            <div class="reading">
              <label>VOLTAGE (V)</label>
              <span id="volts">1.50</span>
            </div>
            <div class="reading">
              <label>CURRENT (I)</label>
              <span id="amps">0.00</span>
            </div>
            <div class="reading" style="grid-column: span 2; margin-top: 5px; border-top: 1px dashed #333; padding-top: 5px;">
              <label>RESISTANCE (R)</label>
              <span>10.0 &Omega;</span>
            </div>
          </div>
        </div>

        <div class="panel-section">
          <h2>Circuit Status</h2>
          <div class="status-box">
            <div id="statusLed" class="led off"></div>
            <div id="statusText" class="status-text">CIRCUIT OPEN</div>
          </div>
        </div>

        <div class="panel-section">
          <h2>Controls</h2>
          <button class="toggle-btn" id="toggleBtn">Toggle Switch</button>
          <p style="font-size: 0.8rem; margin-top: 10px; color: #666; text-align: center;">
            (Or click the switch on the canvas)
          </p>
        </div>

        <div class="panel-section">
          <h2>Legend</h2>
          <div class="legend">
             <div class="legend-item">
               <div class="dot-legend"></div> <span>Electron Flow</span>
             </div>
             <div class="legend-item">
               <div style="width: 10px; height: 2px; background: #c62828;"></div> <span>Positive (+)</span>
             </div>
          </div>
        </div>
      </div>
    </div>

    <footer>
     
    </footer>

    <script src="script.js">
      
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Electrification - Ceiling Fan</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #050505;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      #ui-panel {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(0, 0, 0, 0.85);
        color: white;
        padding: 20px;
        border-radius: 12px;
        border: 1px solid #444;
        pointer-events: none;
        user-select: none;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        z-index: 100;
      }
      .status-item {
        margin: 10px 0;
        font-size: 14px;
        display: flex;
        justify-content: space-between;
        width: 200px;
      }
      .indicator {
        font-weight: bold;
        transition: color 0.3s;
      }
      .on {
        color: #00ff00;
        text-shadow: 0 0 10px #00ff00;
      }
      .off {
        color: #ff3333;
      }
      .instruction {
        font-size: 11px;
        color: #aaa;
        margin-top: 15px;
        border-top: 1px solid #333;
        padding-top: 10px;
      }
    </style>
  </head>
  <body>
    <div id="ui-panel">
      <h2 style="margin: 0 0 15px 0; font-size: 18px; color: #00d2ff">
        Electrical Lab v1.0
      </h2>
      <div class="status-item">
        Main MCB: <span id="mcb-status" class="indicator on">ON</span>
      </div>
      <div class="status-item">
        Light Switch: <span id="light-status" class="indicator off">OFF</span>
      </div>
      <div class="status-item">
        Fan Switch: <span id="fan-status" class="indicator off">OFF</span>
      </div>
      <div class="instruction">
        • CLICK MCB or Switches to operate<br />
        • DRAG to rotate view<br />
        • SCROLL to zoom
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      // --- CONFIG & STATE ---
      const state = {
        mcbOn: true,
        lightOn: false,
        fanOn: false,
        fanSpeed: 0,
        lightIntensity: 0,
      };

      // Store interactive objects
      const interactives = [];

      // --- SCENE SETUP ---
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x111111);
      scene.fog = new THREE.Fog(0x111111, 20, 100);

      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        1000,
      );
      camera.position.set(-15, 5, 35);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ReinhardToneMapping;
      document.body.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      // --- LIGHTING ---
      const ambient = new THREE.AmbientLight(0xffffff, 0.25);
      scene.add(ambient);

      const roomLight = new THREE.DirectionalLight(0xffffff, 0.5);
      roomLight.position.set(-10, 20, 20);
      roomLight.castShadow = true;
      scene.add(roomLight);

      // --- MATERIALS ---
      const matWall = new THREE.MeshStandardMaterial({
        color: 0xaaaaaa,
        roughness: 0.8,
      });
      const matPlasticWhite = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 0.2,
        metalness: 0.1,
      });
      const matPlasticGrey = new THREE.MeshStandardMaterial({
        color: 0x333333,
        roughness: 0.4,
      });
      const matWireRed = new THREE.MeshStandardMaterial({
        color: 0xcc0000,
        roughness: 0.5,
      });
      const matWireBlack = new THREE.MeshStandardMaterial({
        color: 0x111111,
        roughness: 0.5,
      });
      const matGlass = new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        transmission: 0.95,
        roughness: 0.05,
        thickness: 0.2,
        transparent: true,
        emissive: 0x000000,
      });
      const matBrass = new THREE.MeshStandardMaterial({
        color: 0xcc9966,
        roughness: 0.3,
        metalness: 0.5,
      });
      const matMetal = new THREE.MeshStandardMaterial({
        color: 0x888888,
        roughness: 0.3,
        metalness: 0.3,
      });
      const matWood = new THREE.MeshStandardMaterial({
        color: 0x8b5a2b,
        roughness: 0.7,
      });

      // --- MODELS ---

      // Wall
      const wall = new THREE.Mesh(new THREE.PlaneGeometry(100, 60), matWall);
      wall.position.z = -2;
      wall.receiveShadow = true;
      scene.add(wall);

      // 1. Meter Box
      const meter = new THREE.Group();
      meter.add(new THREE.Mesh(new THREE.BoxGeometry(4, 5, 1), matPlasticGrey));
      const screen = new THREE.Mesh(
        new THREE.PlaneGeometry(3, 1.5),
        new THREE.MeshBasicMaterial({ color: 0x224422 }),
      );
      screen.position.set(0, 1, 0.51);
      const meterLed = new THREE.Mesh(
        new THREE.CircleGeometry(0.1, 16),
        new THREE.MeshBasicMaterial({ color: 0xff0000 }),
      );
      meterLed.position.set(-1, -1, 0.51);
      meter.add(screen, meterLed);
      meter.position.set(-10, 10, 0);
      scene.add(meter);

      // 2. MCB Breaker
      const mcb = new THREE.Group();
      const mcbBody = new THREE.Mesh(
        new THREE.BoxGeometry(2.5, 4, 1.2),
        matPlasticWhite,
      );
      mcbBody.castShadow = true;
      mcb.add(mcbBody);

      const mcbLever = new THREE.Mesh(
        new THREE.BoxGeometry(0.6, 1, 0.8),
        matPlasticGrey,
      );
      mcbLever.position.set(0, 0.5, 0.6);
      mcbLever.rotation.x = -Math.PI / 4;
      mcbLever.name = "MCB";
      mcbLever.castShadow = true;
      mcbLever.userData = { type: "mcb" };
      mcb.add(mcbLever);

      mcb.position.set(-10, 2, 0);
      scene.add(mcb);
      interactives.push(mcbLever);

      // 3. Switchboard
      const sb = new THREE.Group();
      sb.add(
        new THREE.Mesh(new THREE.BoxGeometry(10, 4, 0.6), matPlasticWhite),
      );

      function createSwitch(x, name, type) {
        const sw = new THREE.Mesh(
          new THREE.BoxGeometry(1.2, 2, 0.4),
          matPlasticWhite,
        );
        sw.position.set(x, 0, 0.3);
        sw.rotation.x = -Math.PI / 10;
        sw.name = name;
        sw.castShadow = true;
        sw.userData = { type: type };
        sb.add(sw);
        return sw;
      }

      const swLight = createSwitch(-2, "SW_LIGHT", "light");
      const swFan = createSwitch(1, "SW_FAN", "fan");
      sb.position.set(2, -4, 0);
      scene.add(sb);

      interactives.push(swLight, swFan);

      // 4. Hanging Bulb
      const bulbGroup = new THREE.Group();

      const glass = new THREE.Mesh(
        new THREE.SphereGeometry(1.1, 48, 48),
        matGlass,
      );
      glass.castShadow = true;
      glass.receiveShadow = true;
      bulbGroup.add(glass);

      const filamentMat = new THREE.MeshStandardMaterial({
        color: 0xffaa33,
        emissive: 0x331100,
      });
      const filament = new THREE.Mesh(
        new THREE.TorusGeometry(0.5, 0.04, 8, 16),
        filamentMat,
      );
      filament.rotation.x = Math.PI / 2;
      filament.position.y = 0;
      bulbGroup.add(filament);

      const cap = new THREE.Mesh(
        new THREE.CylinderGeometry(0.5, 0.5, 0.8, 8),
        matBrass,
      );
      cap.position.y = 1.0;
      cap.castShadow = true;
      bulbGroup.add(cap);

      const bulbLight = new THREE.PointLight(0xffaa55, 0, 25, 2);
      bulbLight.castShadow = true;
      bulbGroup.add(bulbLight);

      bulbGroup.position.set(0, 8, 3);
      scene.add(bulbGroup);

      // 5. CEILING FAN (hanging from ceiling)
      const ceilingFanGroup = new THREE.Group();
      ceilingFanGroup.position.set(8, 9, 2); // Hanging from ceiling

      // ===== CEILING MOUNT =====
      const mountMat = new THREE.MeshStandardMaterial({
        color: 0x888888,
        roughness: 0.4,
        metalness: 0.3,
      });

      // Ceiling plate
      const ceilingPlate = new THREE.Mesh(
        new THREE.CylinderGeometry(2.0, 2.0, 0.3, 8),
        mountMat,
      );
      ceilingPlate.position.y = 0;
      ceilingPlate.castShadow = true;
      ceilingFanGroup.add(ceilingPlate);

      // Downrod
      const downrodMat = new THREE.MeshStandardMaterial({
        color: 0xaaaaaa,
        roughness: 0.3,
        metalness: 0.4,
      });
      const downrod = new THREE.Mesh(
        new THREE.CylinderGeometry(0.4, 0.4, 2.5, 8),
        downrodMat,
      );
      downrod.position.y = -1.5;
      downrod.castShadow = true;
      ceilingFanGroup.add(downrod);

      // ===== ROTATING PART (MOTOR + BLADES) =====
      const rotatingPart = new THREE.Group();
      rotatingPart.position.y = -2.8; // At bottom of downrod

      // Motor housing
      const motorMat = new THREE.MeshStandardMaterial({
        color: 0x777777,
        roughness: 0.2,
      });
      const motor = new THREE.Mesh(
        new THREE.CylinderGeometry(1.8, 1.8, 1.2, 16),
        motorMat,
      );
      motor.position.y = 0;
      motor.castShadow = true;
      motor.receiveShadow = true;
      rotatingPart.add(motor);

      // Motor bottom cap
      const motorBottom = new THREE.Mesh(
        new THREE.CylinderGeometry(1.6, 1.6, 0.3, 16),
        new THREE.MeshStandardMaterial({ color: 0x999999 }),
      );
      motorBottom.position.y = -0.8;
      motorBottom.castShadow = true;
      rotatingPart.add(motorBottom);

      // ===== BLADES - LONG HORIZONTAL BLADES (ceiling fan style) =====
      const bladeMat = new THREE.MeshStandardMaterial({
        color: 0xddaa77,
        roughness: 0.6,
      }); // Wood color
      const bladeArmMat = new THREE.MeshStandardMaterial({
        color: 0x888888,
        roughness: 0.3,
        metalness: 0.3,
      });

      // Create 4 blades for ceiling fan
      for (let i = 0; i < 4; i++) {
        const bladeGroup = new THREE.Group();

        // Blade arm (connects motor to blade)
        const arm = new THREE.Mesh(
          new THREE.BoxGeometry(0.8, 0.2, 1.2),
          bladeArmMat,
        );
        arm.position.set(1.2, 0.2, 0);
        arm.castShadow = true;
        bladeGroup.add(arm);

        // Main blade - LONG horizontal blade (6 units long)
        const blade = new THREE.Mesh(
          new THREE.BoxGeometry(4.5, 0.1, 1.2),
          bladeMat,
        );
        blade.position.set(3.5, 0.2, 0);
        blade.castShadow = true;
        blade.receiveShadow = true;
        bladeGroup.add(blade);

        // Blade tip
        const tip = new THREE.Mesh(
          new THREE.SphereGeometry(0.25, 6),
          new THREE.MeshStandardMaterial({ color: 0xaaaaaa }),
        );
        tip.position.set(5.8, 0.2, 0);
        tip.castShadow = true;
        bladeGroup.add(tip);

        bladeGroup.rotation.y = (i * Math.PI * 2) / 4;
        rotatingPart.add(bladeGroup);
      }

      // Center cap
      const centerCap = new THREE.Mesh(
        new THREE.CylinderGeometry(1.0, 1.0, 0.3, 8),
        new THREE.MeshStandardMaterial({ color: 0xaaaaaa }),
      );
      centerCap.position.y = 0.2;
      centerCap.castShadow = true;
      rotatingPart.add(centerCap);

      ceilingFanGroup.add(rotatingPart);

      // ===== LIGHT KIT (optional) =====
      const lightKitMat = new THREE.MeshStandardMaterial({ color: 0xcccccc });
      const lightKit = new THREE.Mesh(
        new THREE.CylinderGeometry(1.4, 1.4, 0.4, 8),
        lightKitMat,
      );
      lightKit.position.y = -3.3;
      lightKit.castShadow = true;
      ceilingFanGroup.add(lightKit);

      const lightGlass = new THREE.Mesh(
        new THREE.SphereGeometry(0.8, 16, 16),
        new THREE.MeshStandardMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.7,
        }),
      );
      lightGlass.position.y = -3.7;
      lightGlass.castShadow = true;
      ceilingFanGroup.add(lightGlass);

      scene.add(ceilingFanGroup);

      // --- WIRING ---
      function addWire(points, colorMat) {
        const curve = new THREE.CatmullRomCurve3(points);
        const geo = new THREE.TubeGeometry(curve, 40, 0.08, 8, false);
        const wire = new THREE.Mesh(geo, colorMat);
        wire.castShadow = true;
        scene.add(wire);
      }

      addWire(
        [new THREE.Vector3(-18, 15, 5), new THREE.Vector3(-10, 12, 0)],
        matWireRed,
      );
      addWire(
        [new THREE.Vector3(-10, 7.5, 0), new THREE.Vector3(-10, 4, 0)],
        matWireRed,
      );
      addWire(
        [
          new THREE.Vector3(-10, 0, 0),
          new THREE.Vector3(-10, -4, 0),
          new THREE.Vector3(-3, -4, 0),
        ],
        matWireRed,
      );
      addWire(
        [new THREE.Vector3(0, -2, 0), new THREE.Vector3(0, 8, 3)],
        matWireRed,
      );
      addWire(
        [new THREE.Vector3(4, -2, 0), new THREE.Vector3(8, 6, 2)],
        matWireRed,
      ); // To ceiling fan

      // --- INTERACTION ---
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();

      function handleSwitchClick(obj, type) {
        switch (type) {
          case "mcb":
            state.mcbOn = !state.mcbOn;
            obj.rotation.x = state.mcbOn ? -Math.PI / 4 : Math.PI / 4;
            document.getElementById("mcb-status").innerText = state.mcbOn
              ? "ON"
              : "OFF";
            document.getElementById("mcb-status").className =
              "indicator " + (state.mcbOn ? "on" : "off");
            break;
          case "light":
            state.lightOn = !state.lightOn;
            obj.rotation.x = state.lightOn ? Math.PI / 10 : -Math.PI / 10;
            document.getElementById("light-status").innerText = state.lightOn
              ? "ON"
              : "OFF";
            document.getElementById("light-status").className =
              "indicator " + (state.lightOn ? "on" : "off");
            break;
          case "fan":
            state.fanOn = !state.fanOn;
            obj.rotation.x = state.fanOn ? Math.PI / 10 : -Math.PI / 10;
            document.getElementById("fan-status").innerText = state.fanOn
              ? "ON"
              : "OFF";
            document.getElementById("fan-status").className =
              "indicator " + (state.fanOn ? "on" : "off");
            break;
        }
      }

      window.addEventListener("click", (e) => {
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(interactives);

        if (intersects.length > 0) {
          const obj = intersects[0].object;
          handleSwitchClick(obj, obj.userData.type);
        }
      });

      // Hover effect
      window.addEventListener("mousemove", (e) => {
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(interactives);

        renderer.domElement.style.cursor =
          intersects.length > 0 ? "pointer" : "default";
      });

      // --- ANIMATION LOOP ---
      function animate() {
        requestAnimationFrame(animate);

        const powerAvailable = state.mcbOn;

        // Ceiling fan rotation - motor and blades rotate together
        if (powerAvailable && state.fanOn) {
          state.fanSpeed = Math.min(state.fanSpeed + 0.005, 0.15);
        } else {
          state.fanSpeed = Math.max(state.fanSpeed - 0.01, 0);
        }
        rotatingPart.rotation.y += state.fanSpeed;

        // Bulb
        const targetIntensity = powerAvailable && state.lightOn ? 2.2 : 0;
        state.lightIntensity = THREE.MathUtils.lerp(
          state.lightIntensity,
          targetIntensity,
          0.1,
        );
        bulbLight.intensity = state.lightIntensity * 25;
        glass.material.emissive = new THREE.Color(0xffaa33);
        glass.material.emissiveIntensity = state.lightIntensity * 0.5;

        // Meter LED
        if (powerAvailable) {
          meterLed.material.color.setHex(
            Math.sin(Date.now() * 0.005) > 0 ? 0xff0000 : 0x330000,
          );
        } else {
          meterLed.material.color.setHex(0x330000);
        }

        controls.update();
        renderer.render(scene, camera);
      }

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      animate();
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>🌍 Gravity Simulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: 'Poppins', 'Segoe UI', sans-serif;
        }
        
        /* Make canvas take full screen but with padding for UI */
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        
        /* Main UI Container - Left aligned for desktop */
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            pointer-events: none;
            max-width: 320px;
        }

        /* Title Bar */
        .title-bar {
            background: linear-gradient(135deg, #ff6b6b, #4ecdc4);
            color: white;
            padding: 12px 20px;
            border-radius: 40px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            border: 2px solid white;
            pointer-events: auto;
            backdrop-filter: blur(5px);
            width: fit-content;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .title-emoji {
            font-size: 1.5rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        /* Control Panel - Left Side */
        .control-panel-left {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            pointer-events: auto;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .section-title {
            color: white;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            opacity: 0.9;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        /* Planet Grid */
        .planet-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .planet-card {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .planet-card:hover {
            transform: translateY(-2px);
            border-color: #ffd93d;
            background: rgba(255, 215, 0, 0.25);
        }

        .planet-card.active {
            border-color: #ffd93d;
            background: rgba(255, 215, 0, 0.35);
            box-shadow: 0 0 20px #ffd93d;
        }

        .planet-emoji {
            font-size: 1.8rem;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.5));
        }

        .planet-info {
            display: flex;
            flex-direction: column;
        }

        .planet-name {
            color: white;
            font-weight: bold;
            font-size: 1rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .planet-gravity {
            color: #ffd93d;
            font-size: 0.8rem;
            font-weight: bold;
        }

        /* Gravity Meter */
        .gravity-meter {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 12px 15px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .meter-label {
            font-size: 0.9rem;
            opacity: 0.9;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .meter-value-box {
            background: #ffd93d;
            color: #1a2a3a;
            padding: 5px 15px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 0 15px #ffd93d;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .action-btn {
            flex: 1;
            background: linear-gradient(135deg, #6b5bff, #4ecdc4);
            border: none;
            color: white;
            padding: 12px 15px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 1px solid rgba(255,255,255,0.4);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .action-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .reset-btn {
            background: linear-gradient(135deg, #ff6b6b, #feca57);
        }

        /* Quick Stats */
        .quick-stats {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            color: white;
            font-size: 0.9rem;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .stat-highlight {
            color: #ffd93d;
            font-weight: bold;
            font-size: 1.1rem;
            margin-left: 5px;
        }

        /* Right Side - Facts Panel */
        #facts-container {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 300px;
            pointer-events: none;
            z-index: 100;
        }

        .facts-panel {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 20px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            color: white;
            pointer-events: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .facts-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,215,0,0.3);
        }

        .facts-icon {
            font-size: 2rem;
            background: #ffd93d;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1a2a3a;
        }

        .facts-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffd93d;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .fact-content {
            font-size: 1rem;
            line-height: 1.5;
            min-height: 80px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .fact-highlight {
            color: #ffd93d;
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }

        /* ========== MOBILE RESPONSIVE STYLES ========== */
        @media (max-width: 768px) {
            /* Adjust UI container for mobile - make it smaller */
            #ui-container {
                top: 10px;
                left: 10px;
                right: 10px;
                max-width: none;
                width: calc(100% - 20px);
            }

            .title-bar {
                font-size: 0.9rem;
                padding: 8px 12px;
                margin-bottom: 8px;
                width: fit-content;
                justify-content: flex-start;
            }

            .control-panel-left {
                padding: 12px;
                width: 100%;
            }

            /* Make planet grid more compact on mobile */
            .planet-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 5px;
                margin-bottom: 12px;
            }

            .planet-card {
                padding: 6px 3px;
                flex-direction: column;
                text-align: center;
                gap: 2px;
            }

            .planet-emoji {
                font-size: 1.3rem;
            }

            .planet-name {
                font-size: 0.7rem;
            }

            .planet-gravity {
                font-size: 0.6rem;
            }

            /* Adjust gravity meter for mobile */
            .gravity-meter {
                padding: 8px 10px;
                margin-bottom: 12px;
            }

            .meter-label {
                font-size: 0.7rem;
            }

            .meter-value-box {
                padding: 3px 10px;
                font-size: 0.9rem;
            }

            /* Action buttons on mobile */
            .action-buttons {
                gap: 6px;
                margin-bottom: 10px;
            }

            .action-btn {
                padding: 8px 8px;
                font-size: 0.8rem;
                gap: 4px;
            }

            /* Quick stats on mobile */
            .quick-stats {
                padding: 8px 10px;
                font-size: 0.7rem;
            }

            .stat-highlight {
                font-size: 0.9rem;
            }

            /* Facts panel on mobile - smaller and at bottom */
            #facts-container {
                top: auto;
                bottom: 10px;
                right: 10px;
                left: 10px;
                width: calc(100% - 20px);
                max-width: none;
            }

            .facts-panel {
                padding: 10px 12px;
                border-radius: 20px;
            }

            .facts-header {
                margin-bottom: 6px;
                padding-bottom: 4px;
            }

            .facts-icon {
                width: 25px;
                height: 25px;
                font-size: 1.2rem;
            }

            .facts-title {
                font-size: 0.9rem;
            }

            .fact-content {
                font-size: 0.75rem;
                min-height: 40px;
            }
        }

        /* Small phones */
        @media (max-width: 480px) {
            .planet-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .title-bar {
                font-size: 0.8rem;
                padding: 6px 10px;
            }

            .control-panel-left {
                padding: 10px;
            }

            .planet-emoji {
                font-size: 1.1rem;
            }

            .planet-name {
                font-size: 0.65rem;
            }

            .planet-gravity {
                font-size: 0.55rem;
            }

            #facts-container {
                bottom: 5px;
            }

            .facts-panel {
                padding: 8px 10px;
            }

            .fact-content {
                font-size: 0.7rem;
            }
        }

        /* Landscape mode on mobile */
        @media (max-width: 768px) and (orientation: landscape) {
            #ui-container {
                width: 260px;
            }

            .planet-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            #facts-container {
                width: 260px;
                left: auto;
                right: 10px;
                bottom: 10px;
            }

            .title-bar {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <!-- Left Side - Controls -->
    <div id="ui-container">
        <div class="title-bar">
            <span class="title-emoji">🌍</span>
            <span>GRAVITY SIMULATOR</span>
        </div>

        <div class="control-panel-left">
            <div class="section-title">🌌 SELECT PLANET</div>
            
            <!-- Planet Grid -->
            <div class="planet-grid" id="planet-grid">
                <div class="planet-card active" data-planet="sun">
                    <span class="planet-emoji">☀️</span>
                    <div class="planet-info">
                        <span class="planet-name">Sun</span>
                        <span class="planet-gravity">274</span>
                    </div>
                </div>
                <div class="planet-card" data-planet="jupiter">
                    <span class="planet-emoji">🪐</span>
                    <div class="planet-info">
                        <span class="planet-name">Jupiter</span>
                        <span class="planet-gravity">24.8</span>
                    </div>
                </div>
                <div class="planet-card" data-planet="earth">
                    <span class="planet-emoji">🌍</span>
                    <div class="planet-info">
                        <span class="planet-name">Earth</span>
                        <span class="planet-gravity">9.81</span>
                    </div>
                </div>
                <div class="planet-card" data-planet="venus">
                    <span class="planet-emoji">🟡</span>
                    <div class="planet-info">
                        <span class="planet-name">Venus</span>
                        <span class="planet-gravity">8.87</span>
                    </div>
                </div>
                <div class="planet-card" data-planet="mars">
                    <span class="planet-emoji">🔴</span>
                    <div class="planet-info">
                        <span class="planet-name">Mars</span>
                        <span class="planet-gravity">3.71</span>
                    </div>
                </div>
                <div class="planet-card" data-planet="moon">
                    <span class="planet-emoji">🌙</span>
                    <div class="planet-info">
                        <span class="planet-name">Moon</span>
                        <span class="planet-gravity">1.62</span>
                    </div>
                </div>
            </div>

            <!-- Gravity Meter -->
            <div class="gravity-meter">
                <span class="meter-label">⚡ GRAVITY</span>
                <span class="meter-value-box" id="gravity-display">274.0</span>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button class="action-btn" id="drop-btn">
                    <span>🎾</span> DROP
                </button>
                <button class="action-btn reset-btn" id="reset-btn">
                    <span>🔄</span> RESET
                </button>
            </div>

            <!-- Quick Stats -->
            <div class="quick-stats">
                <span>⚡ Speed <span class="stat-highlight" id="speed-display">0.0</span></span>
                <span>📏 Height <span class="stat-highlight" id="height-display">15.0</span></span>
            </div>
        </div>
    </div>

    <!-- Right Side - Facts Panel -->
    <div id="facts-container">
        <div class="facts-panel">
            <div class="facts-header">
                <div class="facts-icon" id="fact-icon">☀️</div>
                <div class="facts-title">FUN FACT</div>
            </div>
            <div class="fact-content" id="fact-text">
                <span class="fact-highlight">Did you know?</span>
                The Sun's gravity is 28x stronger than Earth's!
            </div>
        </div>
    </div>

    <!-- Import Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from "three";
        import { OrbitControls } from "https://unpkg.com/three@0.128.0/examples/jsm/controls/OrbitControls.js";

        // --- PLANET DATA ---
        const PLANETS = {
          sun: {
            name: "Sun",
            gravity: -274.0,
            color: 0xffaa00,
            emissive: 0xff5500,
            floorColor: 0xffaa33,
            skyColor: 0x1a0f00,
            bounce: 0.2,
            fact: "The Sun's gravity is 28 times stronger than Earth's!",
            emoji: "☀️",
          },
          jupiter: {
            name: "Jupiter",
            gravity: -24.8,
            color: 0xd4a35f,
            emissive: 0x5a3e1a,
            floorColor: 0x8b5a2b,
            skyColor: 0x1a1108,
            bounce: 0.4,
            fact: "1300 Earths could fit inside Jupiter!",
            emoji: "🪐",
          },
          earth: {
            name: "Earth",
            gravity: -9.81,
            color: 0x2288ff,
            emissive: 0x114488,
            floorColor: 0x2a5a2a,
            skyColor: 0x0a1a2a,
            bounce: 0.7,
            fact: "Earth's gravity is 1g - the standard for all planets!",
            emoji: "🌍",
          },
          venus: {
            name: "Venus",
            gravity: -8.87,
            color: 0xffaa33,
            emissive: 0x884411,
            floorColor: 0xaa5511,
            skyColor: 0x2a1a0a,
            bounce: 0.6,
            fact: "Venus is hot enough to melt lead!",
            emoji: "🟡",
          },
          mars: {
            name: "Mars",
            gravity: -3.71,
            color: 0xff6633,
            emissive: 0x552200,
            floorColor: 0x8b4513,
            skyColor: 0x1a0a05,
            bounce: 0.75,
            fact: "You could jump 3x higher on Mars!",
            emoji: "🔴",
          },
          moon: {
            name: "Moon",
            gravity: -1.62,
            color: 0xcccccc,
            emissive: 0x333333,
            floorColor: 0x555555,
            skyColor: 0x080808,
            bounce: 0.85,
            fact: "Moon gravity is 1/6 of Earth's!",
            emoji: "🌙",
          },
        };

        // --- SIMULATION VARIABLES ---
        let currentPlanet = "sun";
        let gravity = PLANETS.sun.gravity;
        let bounceFactor = PLANETS.sun.bounce;
        let velocity = 0;
        let position = 15;
        let isFalling = false;
        let ballRadius = 1.2;
        let startHeight = 15;

        // Detect mobile device
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;

        // --- THREE.JS SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(PLANETS.sun.skyColor);

        // Camera - better positioning to see the ball clearly
        const camera = new THREE.PerspectiveCamera(
          45,
          window.innerWidth / window.innerHeight,
          0.1,
          1000,
        );

        if (isMobile) {
          camera.position.set(5, 7, 18);
        } else {
          camera.position.set(8, 10, 25);
        }
        camera.lookAt(0, 8, 0);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setClearColor(PLANETS.sun.skyColor);
        document.body.appendChild(renderer.domElement);

        // Controls - optimize for mobile
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 8, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2.2;
        controls.minDistance = isMobile ? 8 : 12;
        controls.maxDistance = isMobile ? 20 : 35;
        controls.enableZoom = true;
        controls.enablePan = false; // Disable pan for cleaner view
        controls.enableRotate = true;
        controls.rotateSpeed = isMobile ? 0.5 : 0.8;

        // --- LIGHTS ---
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = isMobile ? 512 : 1024;
        dirLight.shadow.mapSize.height = isMobile ? 512 : 1024;
        scene.add(dirLight);

        const fillLight = new THREE.PointLight(0x4466ff, 0.5);
        fillLight.position.set(-10, 10, 10);
        scene.add(fillLight);

        // Add a second fill light from the front
        const frontLight = new THREE.PointLight(0xffffff, 0.3);
        frontLight.position.set(0, 10, 20);
        scene.add(frontLight);

        // --- BACKGROUND STARS ---
        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = isMobile ? 200 : 500;
        const starsPositions = new Float32Array(starsCount * 3);

        for (let i = 0; i < starsCount * 3; i += 3) {
          starsPositions[i] = (Math.random() - 0.5) * 200;
          starsPositions[i + 1] = (Math.random() - 0.5) * 200;
          starsPositions[i + 2] = (Math.random() - 0.5) * 200;
        }

        starsGeometry.setAttribute(
          "position",
          new THREE.BufferAttribute(starsPositions, 3),
        );
        const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.15 });
        const stars = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(stars);

        // --- FLOOR ---
        const floorGeometry = new THREE.CircleGeometry(30, 64);
        const floorMaterial = new THREE.MeshStandardMaterial({
          color: PLANETS.sun.floorColor,
          roughness: 0.7,
          metalness: 0.1,
        });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = 0;
        floor.receiveShadow = true;
        scene.add(floor);

        // Add a simple grid
        const gridHelper = new THREE.GridHelper(30, 20, 0xffffff, 0xaaaaaa);
        gridHelper.position.y = 0.01;
        gridHelper.material.opacity = 0.15;
        gridHelper.material.transparent = true;
        scene.add(gridHelper);

        // --- THE BALL (Solid, highlighted) ---
        const ballGroup = new THREE.Group();

        const ballGeometry = new THREE.SphereGeometry(ballRadius, 48, 48);
        const ballMaterial = new THREE.MeshStandardMaterial({
          color: 0xff6600,
          emissive: 0x442200,
          roughness: 0.2,
          metalness: 0.3,
        });
        const ballMesh = new THREE.Mesh(ballGeometry, ballMaterial);
        ballMesh.castShadow = true;
        ballMesh.receiveShadow = true;
        ballGroup.add(ballMesh);

        // Add a simple highlight (small white sphere)
        const highlightGeometry = new THREE.SphereGeometry(ballRadius * 0.2, 8, 8);
        const highlightMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x666666 });
        const highlight = new THREE.Mesh(highlightGeometry, highlightMaterial);
        highlight.position.set(0.5, 0.5, 0.5);
        ballGroup.add(highlight);

        ballGroup.position.set(0, startHeight, 0);
        scene.add(ballGroup);

        // --- GRAVITY VISUALIZATION ---
        const linePoints = [];
        for (let i = 0; i <= 20; i++) {
          linePoints.push(new THREE.Vector3(0, i, 0));
        }
        const lineGeometry = new THREE.BufferGeometry().setFromPoints(linePoints);
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0x44aaff, transparent: true, opacity: 0.2 });
        const pathLine = new THREE.Line(lineGeometry, lineMaterial);
        scene.add(pathLine);

        // Height markers
        const markerCount = 5;
        const markerMaterial = new THREE.MeshStandardMaterial({ color: 0x44aaff, emissive: 0x112244 });
        for (let i = 1; i <= markerCount; i++) {
          const marker = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8), markerMaterial);
          marker.position.set(0, i * 3, 0);
          scene.add(marker);
        }

        // --- UI ELEMENTS ---
        const gravityDisplay = document.getElementById("gravity-display");
        const speedDisplay = document.getElementById("speed-display");
        const heightDisplay = document.getElementById("height-display");
        const factIcon = document.getElementById("fact-icon");
        const factText = document.getElementById("fact-text");
        const planetCards = document.querySelectorAll(".planet-card");
        const dropBtn = document.getElementById("drop-btn");
        const resetBtn = document.getElementById("reset-btn");

        // --- FUNCTIONS ---
        function setPlanet(planetKey) {
          const data = PLANETS[planetKey];
          if (!data) return;

          currentPlanet = planetKey;
          gravity = data.gravity;
          bounceFactor = data.bounce;

          gravityDisplay.textContent = Math.abs(gravity).toFixed(1);
          factIcon.textContent = data.emoji;
          factText.innerHTML = `<span class="fact-highlight">Did you know?</span> ${data.fact}`;

          scene.background.setHex(data.skyColor);
          floor.material.color.setHex(data.floorColor);

          planetCards.forEach((card) => {
            card.classList.remove("active");
            if (card.dataset.planet === planetKey) {
              card.classList.add("active");
            }
          });

          resetBall();
        }

        function dropBall() {
          if (!isFalling) {
            isFalling = true;
            velocity = 0.2;
            position = ballGroup.position.y;
          }
        }

        function resetBall() {
          isFalling = false;
          velocity = 0;
          ballGroup.position.y = startHeight;
          ballGroup.scale.set(1, 1, 1);
        }

        // --- EVENT LISTENERS ---
        planetCards.forEach((card) => {
          card.addEventListener("click", () => {
            setPlanet(card.dataset.planet);
          });
          card.addEventListener("touchstart", (e) => {
            e.preventDefault();
            setPlanet(card.dataset.planet);
          });
        });

        dropBtn.addEventListener("click", dropBall);
        dropBtn.addEventListener("touchstart", (e) => {
          e.preventDefault();
          dropBall();
        });

        resetBtn.addEventListener("click", resetBall);
        resetBtn.addEventListener("touchstart", (e) => {
          e.preventDefault();
          resetBall();
        });

        // --- ANIMATION LOOP ---
        const clock = new THREE.Clock();

        function animate() {
          const delta = Math.min(clock.getDelta(), 0.1);

          if (isFalling) {
            velocity += gravity * delta;
            position += velocity * delta;
            ballGroup.position.y = position;

            const speed = Math.abs(velocity);
            const stretch = Math.min(1 + speed * 0.03, 1.15);
            const squash = 1 / Math.sqrt(stretch);
            ballGroup.scale.set(squash, stretch, squash);

            if (position <= ballRadius) {
              position = ballRadius;
              velocity = -velocity * bounceFactor;

              if (Math.abs(velocity) < 0.2) {
                isFalling = false;
                velocity = 0;
                ballGroup.scale.set(1, 1, 1);
              }
            }

            speedDisplay.textContent = Math.abs(velocity).toFixed(1);
            heightDisplay.textContent = position.toFixed(1);
          } else {
            ballGroup.position.y = startHeight + Math.sin(Date.now() * 0.002) * 0.2;
            speedDisplay.textContent = "0.0";
            heightDisplay.textContent = ballGroup.position.y.toFixed(1);
          }

          stars.rotation.y += 0.0001;
          controls.update();
          renderer.render(scene, camera);

          requestAnimationFrame(animate);
        }

        // Handle window resize
        window.addEventListener("resize", () => {
          const newIsMobile = window.innerWidth <= 768;
          
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
          
          if (newIsMobile) {
            camera.position.set(5, 7, 18);
          } else {
            camera.position.set(8, 10, 25);
          }
          camera.lookAt(0, 8, 0);
        });

        // Initialize with Sun
        setPlanet("sun");
        animate();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> motor effect</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#080a0c;overflow:hidden;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  #c{display:block;width:100vw;height:100vh}

  #ui{
    position:fixed;bottom:0;left:0;right:0;
    background:linear-gradient(0deg, rgba(8,12,16,0.98) 0%, rgba(8,12,16,0.5) 100%);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-top:1px solid rgba(220,180,100,0.25);
    padding:18px 30px 22px;
    display:flex;align-items:flex-end;gap:42px;
    pointer-events:none;
    box-shadow:0 -8px 25px rgba(0,0,0,0.7);
  }
  .ctrl{pointer-events:all;display:flex;flex-direction:column;gap:6px;min-width:160px}
  .ctrl label{font-size:12px;font-weight:400;letter-spacing:0.04em;color:#b8bdc9;text-transform:uppercase;display:flex;justify-content:space-between}
  .ctrl .val{font-size:15px;color:#fad98b;font-weight:500;font-variant-numeric:tabular-nums}
  input[type=range]{
    background:rgba(220,200,160,0.2);border-radius:2px;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:18px;height:18px;border-radius:50%;
    background:#fad98b;border:2px solid #1a1e24;cursor:pointer;
    box-shadow:0 0 12px #f0b458;transition:0.1s;
  }
  .btns{pointer-events:all;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  button{
    background:rgba(28,32,38,0.85);border:1px solid rgba(210,170,100,0.35);
    color:#e0e2e8;font-size:12px;font-weight:500;padding:8px 18px;
    border-radius:40px;cursor:pointer;transition:all 0.15s;text-transform:none;
    backdrop-filter:blur(4px);letter-spacing:0.02em;
    box-shadow:0 4px 8px rgba(0,0,0,0.5);
  }
  button:hover{background:rgba(48,54,62,0.95);border-color:#e5c484;color:#ffffff}
  button.on{background:#3f362b;border-color:#f0c880;color:#fce7b4;box-shadow:0 0 12px #d7a14088}

  #info{
    position:fixed;top:0;left:0;right:0;
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 30px;
    background:linear-gradient(180deg, rgba(8,12,16,0.95) 0%, rgba(8,12,16,0) 100%);
    pointer-events:none;
    backdrop-filter:blur(4px);
  }
  #info h1{font-size:16px;font-weight:500;letter-spacing:0.1em;color:#f0d9a0;text-transform:uppercase;margin-bottom:3px}
  #info .sub{font-size:11px;color:#8f99a8;letter-spacing:0.04em}
  #readout{display:flex;gap:36px}
  .rd{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
  .rd span:first-child{font-size:10px;color:#78808e;text-transform:uppercase;font-weight:400}
  .rd span:last-child{font-size:16px;color:#f5e2c1;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2}

  #tip{
    position:fixed;bottom:130px;left:50%;transform:translateX(-50%);
    font-size:13px;color:#cdd3de;background:rgba(16,20,26,0.85);backdrop-filter:blur(4px);
    padding:8px 24px;border-radius:60px;border:1px solid #5a5f6b;
    letter-spacing:0.02em;pointer-events:none;transition:opacity 1s;
    box-shadow:0 6px 16px rgba(0,0,0,0.4);white-space:nowrap;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="info">
  <div>
    <h1>⚙️ DC MOTOR · LORENTZ FORCE · TRANSPARENT MAGNETS</h1>
    <div class="sub">F = B·I·L  —  blue N (top) · red S (bottom) · see inside poles</div>
  </div>
  <div id="readout">
    <div class="rd"><span>RPM</span><span id="r-rpm">0</span></div>
    <div class="rd"><span>TORQUE</span><span id="r-torq">0.00 N·m</span></div>
    <div class="rd"><span>CURRENT</span><span id="r-cur">2.0 A</span></div>
    <div class="rd"><span>FIELD</span><span id="r-fld">1.0 T</span></div>
  </div>
</div>

<div id="ui">
  <div class="btns">
    <button id="btn-pp" class="on" onclick="togglePlay()">⏸ PAUSE</button>
    <button onclick="resetMotor()">↺ RESET</button>
    <button id="btn-rev" onclick="reverseDir()">⇄ REVERSE</button>
    <button id="btn-xray" onclick="toggleXray()">⬡ X-RAY</button>
    <button id="btn-arrows" onclick="toggleArrows()">↑ FORCE</button>
  </div>
  <div class="ctrl">
    <label>CURRENT (A) <span class="val" id="d-cur">2.0 A</span></label>
    <input type="range" min="0" max="6" step="0.1" value="2" oninput="setParam('I',+this.value,'d-cur')">
  </div>
  <div class="ctrl">
    <label>FIELD B (T) <span class="val" id="d-fld">1.0 T</span></label>
    <input type="range" min="0" max="3" step="0.1" value="1" oninput="setParam('B',+this.value,'d-fld')">
  </div>
  <div class="ctrl">
    <label>SPEED MULT. <span class="val" id="d-spd">1.0×</span></label>
    <input type="range" min="0.1" max="4" step="0.1" value="1" oninput="setParam('S',+this.value,'d-spd')">
  </div>
</div>

<div id="tip">🖱️ DRAG TO ROTATE · SCROLL TO ZOOM · MAGNETS: TRANSPARENT GLOW</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="index.js" >

</script>
</body>
</html>

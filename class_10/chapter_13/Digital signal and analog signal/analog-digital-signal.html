<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>analog · digital – fully fluid · zero code changes</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: linear-gradient(145deg, #bdd3e8 0%, #a3c0da 100%);
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      overflow-x: hidden;
    }

    /* main flex row - uses viewport units + auto margins → perfectly fluid */
    .app-row {
      display: flex;
      width: 100%;
      max-width: 1600px;         /* keeps very wide screens comfortable, still flexible */
      min-height: 100vh;
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(12px);
      padding: 1.5rem 2rem;
      gap: 2.5rem;
      margin: 0 auto;
      box-shadow: none;
    }

    /* ===== LEFT COLUMN (stacked) ===== */
    .left-stacked {
      flex: 0 0 260px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 1.8rem;
      padding-top: 0.5rem;
      padding-bottom: 0.5rem;
      height: auto;
      min-height: 100%;
    }

    .big-toggle {
      width: 100%;
      padding: 1.8rem 0.5rem;
      font-size: 2rem;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      background: white;
      box-shadow: 0 16px 24px -12px #1a3b4e;
      cursor: pointer;
      transition: 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 4px solid transparent;
      line-height: 1.2;
    }

    .big-toggle span {
      font-size: 2.8rem;
    }

    .big-toggle.analog-btn {
      color: #b45f06;
      background: #fff1e0;
    }
    .big-toggle.digital-btn {
      color: #1f3a4b;
      background: #e7f0f8;
    }

    .big-toggle.active {
      border-color: currentColor;
      transform: scale(1.02);
      box-shadow: 0 26px 32px -12px #0a3140;
    }

    .big-toggle.analog-btn.active {
      background: #f39c12;
      color: white;
    }
    .big-toggle.digital-btn.active {
      background: #2c3e50;
      color: white;
    }

    /* CONTROL BAR */
    .left-controls {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 0.5rem;
      width: 100%;
    }

    .control-btn {
      background: white;
      border: none;
      padding: 1.2rem 0.5rem;
      border-radius: 40px;
      font-size: 1.4rem;
      font-weight: 600;
      border: 2px solid #2c5f77;
      color: #1b4f63;
      cursor: pointer;
      transition: 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }
    .control-btn:hover {
      background: #2c5f77;
      color: white;
    }

    .speed-ctrl-left {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: white;
      padding: 0.8rem 1.2rem;
      border-radius: 40px;
      border: 2px solid #2c5f77;
      width: 100%;
    }
    .speed-ctrl-left span {
      font-weight: 600;
      color: #1b4f63;
      font-size: 1.4rem;
    }
    .speed-ctrl-left input {
      width: 130px;
      accent-color: #2c5f77;
    }

    /* ===== RIGHT CONTENT ===== */
    .right-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100%;
      gap: 2.2rem;
    }

    /* SIGNAL CARD */
    .signal-card {
      background: white;
      border-radius: 3.5rem;
      padding: 2.5rem 2.2rem;
      box-shadow: 0 30px 38px -18px #1e4059;
      border: 2px solid rgba(255,255,255,0.9);
      width: 100%;
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .analog-card {
      border-top: 14px solid #f39c12;
    }
    .digital-card {
      border-top: 14px solid #2c3e50;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 1.5rem;
      flex-shrink: 0;
    }
    .card-header .icon {
      font-size: 3.8rem;
    }
    .card-header h2 {
      font-size: clamp(2rem, 5vw, 3.2rem);  /* fluid but capped */
      font-weight: 700;
    }
    .analog-card .card-header h2 {
      color: #b85e00;
    }
    .digital-card .card-header h2 {
      color: #1a2634;
    }

    /* GRAPH BOX — perfect centering + canvas natural size, but container fluid */
    .graph-box {
      background: #f6fafd;
      border-radius: 3rem;
      padding: 1.5rem;
      border: 1px solid #c5d5e5;
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      width: 100%;
    }
    
    canvas {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;               /* preserves ratio based on canvas width/height */
      max-height: 100%;
      background: white;
      border-radius: 2.5rem;
      border: 1px solid #b3c9dd;
      object-fit: contain;
    }

    .feature-mini {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      flex-shrink: 0;
      margin-top: 1rem;
    }
    .chip {
      background: #eef4f9;
      border-radius: 50px;
      padding: 0.8rem 1.8rem;
      font-size: clamp(1.2rem, 2.5vw, 1.5rem);
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .digital-card .chip {
      background: #e3eaf1;
    }

    /* EXAMPLES CARD */
    .examples-card {
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(4px);
      border-radius: 3rem;
      padding: 2.2rem 2.2rem;
      box-shadow: 0 18px 26px -14px #14303f;
      border: 2px solid rgba(255,255,240,0.7);
      flex-shrink: 0;
      width: 100%;
    }

    .examples-card h4 {
      font-size: clamp(1.8rem, 4vw, 2.2rem);
      font-weight: 600;
      color: #113946;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 12px;
      border-left: 12px solid #f39c12;
      padding-left: 1.4rem;
    }
    .examples-card.digital-examples h4 {
      border-left-color: #2c3e50;
    }

    .example-list {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .example-item {
      background: white;
      border-radius: 70px;
      padding: 1.1rem 1.8rem;
      font-size: clamp(1.4rem, 2.8vw, 1.7rem);
      font-weight: 500;
      color: #1f4a5e;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      box-shadow: 0 6px 12px rgba(0,30,40,0.1);
      border-left: 10px solid;
      flex-wrap: wrap;
    }
    .analog-ex-item {
      border-left-color: #f39c12;
    }
    .digital-ex-item {
      border-left-color: #2c3e50;
    }
    .example-item span:first-child {
      font-size: 2.5rem;
    }
    .ex-tag {
      background: #dae7f2;
      color: #0e3d52;
      font-size: clamp(1.2rem, 2vw, 1.3rem);
      font-weight: 600;
      padding: 0.3rem 1.5rem;
      border-radius: 40px;
      margin-left: auto;
      white-space: nowrap;
    }

    /* ===== FULLY RESPONSIVE — only container/stack changes, NO CODE TOUCH ===== */
    @media (max-width: 800px) {
      .app-row {
        flex-direction: column;
        padding: 1.2rem;
        gap: 1.5rem;
      }
      .left-stacked {
        flex: auto;
        width: 100%;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        gap: 1rem;
        padding-top: 0;
        height: auto;
        min-height: auto;
      }
      .big-toggle {
        flex: 1 1 160px;
        padding: 1.3rem 0.5rem;
        font-size: 1.6rem;
      }
      .big-toggle span {
        font-size: 2.2rem;
      }
      .left-controls {
        flex-direction: row;
        flex-wrap: wrap;
        margin-top: 0;
        width: 100%;
      }
      .control-btn {
        flex: 1 1 auto;
        padding: 1rem 1rem;
        font-size: 1.3rem;
      }
      .speed-ctrl-left {
        flex: 2 1 200px;
        padding: 0.5rem 1.2rem;
      }
      .speed-ctrl-left input {
        width: 110px;
      }
    }

    @media (max-width: 500px) {
      .app-row {
        padding: 0.8rem;
        gap: 1rem;
      }
      .big-toggle {
        flex: 1 1 130px;
        font-size: 1.4rem;
        padding: 0.8rem 0.2rem;
      }
      .big-toggle span {
        font-size: 1.8rem;
      }
      .control-btn {
        font-size: 1.1rem;
        padding: 0.7rem 0.3rem;
      }
      .speed-ctrl-left {
        font-size: 1.2rem;
        padding: 0.4rem 0.8rem;
      }
      .signal-card {
        padding: 1.5rem 1rem;
        border-radius: 2.5rem;
      }
      .graph-box {
        padding: 0.8rem;
      }
      .feature-mini .chip {
        padding: 0.4rem 1.2rem;
        font-size: 1rem;
      }
      .example-item {
        padding: 0.7rem 1.2rem;
        gap: 0.8rem;
      }
      .example-item span:first-child {
        font-size: 1.8rem;
      }
      .ex-tag {
        padding: 0.2rem 0.8rem;
        font-size: 1rem;
      }
    }

    /* extreme small devices (<=360px) — everything still works, no overflow */
    @media (max-width: 360px) {
      .big-toggle {
        flex: 1 1 100%;
      }
      .left-controls {
        flex-direction: column;
      }
      .control-btn, .speed-ctrl-left {
        width: 100%;
      }
      .example-item {
        flex-direction: column;
        align-items: flex-start;
      }
      .ex-tag {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
<div class="app-row">
  <!-- LEFT: stacked + controls -->
  <div class="left-stacked">
    <button class="big-toggle analog-btn active" id="btnAnalog">
      <span>📡</span> analog
    </button>
    <button class="big-toggle digital-btn" id="btnDigital">
      <span>💻</span> digital
    </button>
    
    <!-- controls -->
    <div class="left-controls">
      <button class="control-btn" id="playPauseBtn">⏸️ pause</button>
      <div class="speed-ctrl-left">
        <span>⚡</span>
        <input type="range" id="speedSlider" min="0.2" max="3" value="1" step="0.1">
      </div>
      <button class="control-btn" id="resetPhaseBtn">⟲ reset</button>
    </div>
  </div>

  <!-- RIGHT: signal + examples -->
  <div class="right-content">
    <!-- analog card -->
    <div id="analogSignalCard" class="signal-card analog-card">
      <div class="card-header">
        <span class="icon">🌊</span>
        <h2>analog signal</h2>
      </div>
      <div class="graph-box">
        <canvas id="analogCanvas" width="700" height="180"></canvas>
      </div>
      <div class="feature-mini">
        <div class="chip"><span>📈</span> continuous</div>
        <div class="chip"><span>🎚️</span> infinite values</div>
        <div class="chip"><span>🌊</span> smooth wave</div>
      </div>
    </div>

    <!-- digital card (hidden initially) -->
    <div id="digitalSignalCard" class="signal-card digital-card" style="display: none;">
      <div class="card-header">
        <span class="icon">⚡</span>
        <h2>digital signal</h2>
      </div>
      <div class="graph-box">
        <canvas id="digitalCanvas" width="700" height="180"></canvas>
      </div>
      <div class="feature-mini">
        <div class="chip"><span>📊</span> discrete (0/1)</div>
        <div class="chip"><span>🎯</span> square wave</div>
        <div class="chip"><span>🛡️</span> noise resistant</div>
      </div>
    </div>

    <!-- examples card -->
    <div class="examples-card" id="examplesCard">
      <h4 id="examplesHeading">📌 analog examples</h4>
      <div class="example-list" id="exampleList"></div>
    </div>
  </div>
</div>

<script>
  (function() {
    // CANVAS SETUP (preserve intrinsic size; CSS makes it responsive)
    const analogCanvas = document.getElementById('analogCanvas');
    const digitalCanvas = document.getElementById('digitalCanvas');
    function setCanvasSize(canvas, w, h) {
      canvas.width = w; canvas.height = h; 
      // style width/height set to auto via CSS, we just define canvas intrinsic dimensions
    }
    setCanvasSize(analogCanvas, 700, 180);
    setCanvasSize(digitalCanvas, 700, 180);

    // UI elements
    const analogBtn = document.getElementById('btnAnalog');
    const digitalBtn = document.getElementById('btnDigital');
    const analogCard = document.getElementById('analogSignalCard');
    const digitalCard = document.getElementById('digitalSignalCard');
    const examplesCard = document.getElementById('examplesCard');
    const examplesHeading = document.getElementById('examplesHeading');
    const exampleList = document.getElementById('exampleList');

    // example data
    const analogEx = [
      { icon: '🎤', text: 'microphone / voice', tag: 'sound' },
      { icon: '🌡️', text: 'mercury thermometer', tag: 'continuous' },
      { icon: '📻', text: 'AM radio wave', tag: 'smooth' }
    ];
    const digitalEx = [
      { icon: '💽', text: 'USB flash drive', tag: 'binary' },
      { icon: '⌨️', text: 'keyboard (on/off)', tag: '0/1' },
      { icon: '💡', text: 'LED on/off', tag: 'discrete' }
    ];

    function renderExamples(type) {
      const list = type === 'analog' ? analogEx : digitalEx;
      examplesHeading.innerText = type === 'analog' ? '📌 analog examples' : '📌 digital examples';
      if (type === 'digital') {
        examplesCard.classList.add('digital-examples');
      } else {
        examplesCard.classList.remove('digital-examples');
      }

      let html = '';
      list.forEach(item => {
        const exClass = type === 'analog' ? 'analog-ex-item' : 'digital-ex-item';
        html += `
          <div class="example-item ${exClass}">
            <span>${item.icon}</span>
            <span>${item.text}</span>
            <span class="ex-tag">${item.tag}</span>
          </div>
        `;
      });
      exampleList.innerHTML = html;
    }

    // toggle
    function showAnalog() {
      analogBtn.classList.add('active');
      digitalBtn.classList.remove('active');
      analogCard.style.display = 'flex';
      digitalCard.style.display = 'none';
      renderExamples('analog');
    }
    function showDigital() {
      digitalBtn.classList.add('active');
      analogBtn.classList.remove('active');
      analogCard.style.display = 'none';
      digitalCard.style.display = 'flex';
      renderExamples('digital');
    }

    analogBtn.addEventListener('click', showAnalog);
    digitalBtn.addEventListener('click', showDigital);
    renderExamples('analog'); // initial

    // animation 
    let phase = 0, animId, isPlaying = true, speed = 1.0;
    const playPause = document.getElementById('playPauseBtn');
    const speedSlider = document.getElementById('speedSlider');
    const resetBtn = document.getElementById('resetPhaseBtn');

    // analog draw
    function drawAnalog(phaseRad) {
      const ctx = analogCanvas.getContext('2d');
      const w = analogCanvas.width, h = analogCanvas.height;
      ctx.clearRect(0,0,w,h);
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
      ctx.strokeStyle = '#d0deeb'; ctx.lineWidth = 1;
      for (let i=0;i<=w;i+=70) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,h); ctx.stroke(); }
      for (let j=0;j<=h;j+=45) { ctx.beginPath(); ctx.moveTo(0,j); ctx.lineTo(w,j); ctx.stroke(); }
      ctx.beginPath(); ctx.strokeStyle = '#f39c12'; ctx.lineWidth = 6; ctx.shadowColor = '#f1c40f'; ctx.shadowBlur = 14;
      const amp = 55, center = h/2;
      for (let x=0; x<w; x++) {
        let y = center + amp * Math.sin((x/w)*5*Math.PI + phaseRad);
        if (x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke(); ctx.shadowBlur = 0;
      ctx.fillStyle = '#d35400';
      for (let x=35; x<w; x+=80) {
        let y = center + amp * Math.sin((x/w)*5*Math.PI + phaseRad);
        ctx.beginPath(); ctx.arc(x, y, 5.5, 0, 2*Math.PI); ctx.fill();
      }
    }

    // digital draw
    function drawDigital(phaseRad) {
      const ctx = digitalCanvas.getContext('2d');
      const w = digitalCanvas.width, h = digitalCanvas.height;
      ctx.clearRect(0,0,w,h); ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
      ctx.strokeStyle = '#d0deeb'; ctx.lineWidth=1;
      for (let i=0;i<=w;i+=70) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,h); ctx.stroke(); }
      for (let j=0;j<=h;j+=45) { ctx.beginPath(); ctx.moveTo(0,j); ctx.lineTo(w,j); ctx.stroke(); }
      const lowY = h-45, highY = 45, cycles = 3, cycleW = w/cycles;
      ctx.beginPath(); ctx.strokeStyle = '#2c3e50'; ctx.lineWidth = 6.5; ctx.shadowColor = '#2d6a7f'; ctx.shadowBlur = 12;
      for (let i=-2; i<=4; i++) {
        let start = i*cycleW - (phaseRad*26)%cycleW;
        let mid = start + cycleW/2, end = start + cycleW;
        if (end < -45 || start > w+45) continue;
        ctx.moveTo(start, lowY); ctx.lineTo(start, highY); ctx.lineTo(mid, highY); ctx.lineTo(mid, lowY); ctx.lineTo(end, lowY);
      }
      ctx.stroke(); ctx.shadowBlur = 0;
      ctx.fillStyle = '#1e3b4f';
      for (let i=-2; i<=4; i++) {
        let base = i*cycleW - (phaseRad*26)%cycleW;
        if (base>=-30 && base<=w+30) { ctx.beginPath(); ctx.arc(base, lowY, 5.5, 0, 2*Math.PI); ctx.fill(); }
        let high = base + cycleW/2;
        if (high>=-30 && high<=w+30) { ctx.beginPath(); ctx.arc(high, highY, 5.5, 0, 2*Math.PI); ctx.fill(); }
      }
      ctx.font = 'bold 20px Inter, sans-serif'; ctx.fillStyle = '#1e4a5f'; ctx.fillText('0', 30, h-30); ctx.fillText('1', 30, 65);
    }

    function animate() {
      if (isPlaying) phase += 0.018 * speed;
      drawAnalog(phase);
      drawDigital(phase);
      animId = requestAnimationFrame(animate);
    }
    animate();

    playPause.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playPause.innerHTML = isPlaying ? '⏸️ pause' : '▶️ play';
    });
    speedSlider.addEventListener('input', e => speed = parseFloat(e.target.value));
    resetBtn.addEventListener('click', () => { phase = 0; drawAnalog(phase); drawDigital(phase); });

    // initial draws
    drawAnalog(phase); drawDigital(phase);
    window.addEventListener('beforeunload', () => animId && cancelAnimationFrame(animId));
  })();
</script>
</body>
</html>

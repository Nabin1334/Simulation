<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Measurement of temperature</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #e2eaf6;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .friendly-card {
            max-width: 1100px;
            width: 100%;
            background: #f6faff;
            border-radius: 48px;
            box-shadow: 0 20px 40px rgba(0, 20, 50, 0.2);
            padding: 28px;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 24px;
            border: 2px solid rgba(255,255,255,0.7);
            backdrop-filter: blur(2px);
        }

        /* left buttons – clean and friendly */
        .left-buttons {
            width: 240px;
            background: #d9e6f5;
            border-radius: 36px;
            padding: 28px 16px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            box-shadow: inset 0 2px 6px white, 0 8px 14px #99b5d3;
        }
        .thermo-option {
            background: #ffffffdd;
            border: none;
            border-radius: 60px;
            padding: 18px 12px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #003c77;
            box-shadow: 0 4px 0 #7f9fc7, 0 6px 12px #b0c4db;
            cursor: pointer;
            transition: 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 1px solid white;
        }
        .thermo-option.active {
            background: #ffcf8a;
            color: #002856;
            transform: translateY(3px);
            box-shadow: 0 1px 0 #7f9fc7, 0 5px 8px #a2b9d4;
        }
        .thermo-option:hover {
            background: #f3e3c2;
        }

        /* NEW: Environmental Controls */
        .control-panel {
            background: #ffffffaa;
            border-radius: 24px;
            padding: 16px;
            margin-top: auto;
            text-align: center;
            border: 1px solid white;
        }
        .control-panel label {
            display: block;
            font-size: 0.95rem;
            color: #02457a;
            font-weight: 600;
            margin-bottom: 8px;
        }
        input[type=range] {
            width: 100%;
            cursor: pointer;
        }

        /* right side: canvas + info */
        .right-showcase {
            flex: 1;
            min-width: 380px;
            background: #eef5fc;
            border-radius: 40px;
            padding: 24px;
            box-shadow: inset 0 1px 5px #bdd2ec, 0 10px 20px #b6cee8;
            display: flex;
            flex-direction: column;
        }
        canvas {
            display: block;
            width: 100%;
            max-width: 550px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 6px 18px #abbcd1, inset 0 0 0 2px white;
            height: auto;
        }
        .explain-box {
            background: #deeaf9;
            border-radius: 32px;
            padding: 22px;
            margin-top: 24px;
            border: 2px solid white;
        }
        .explain-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0f3d6b;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .explain-text {
            font-size: 1.1rem;
            background: white;
            padding: 20px 26px;
            border-radius: 36px;
            color: #00213f;
            box-shadow: inset 0 1px 4px #bed3ef;
            line-height: 1.5;
        }
        .explain-text strong {
            background: #ffddb0;
            padding: 4px 12px;
            border-radius: 30px;
            font-weight: 600;
            margin-right: 8px;
        }
        .footnote {
            margin-top: 12px;
            color: #336391;
            padding-left: 12px;
            font-weight: 500;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
<div class="friendly-card">
    <div class="left-buttons">
        <button class="thermo-option active" id="btnLiquid">🌡️ Liquid</button>
        <button class="thermo-option" id="btnDigital">📟 Digital</button>
        <button class="thermo-option" id="btnRadiation">🔥 Radiation</button>
        
        <div class="control-panel">
            <label for="tempSlider">Target Object Temp: <br><span id="targetTempValue">28.5 °C</span></label>
            <input type="range" id="tempSlider" min="-20" max="150" value="28.5" step="0.5">
        </div>
    </div>

    <div class="right-showcase">
        <div id="p5canvas"></div>

        <div class="explain-box">
            <div class="explain-title" id="infoTitle">🌡️ Liquid Thermometer</div>
            <div class="explain-text" id="infoDesc">
                <strong>How it works</strong> Liquid expands when heated, rising in a thin glass tube.<br>
                <strong>Range</strong> –10 °C … 110 °C · <strong>Uses</strong> Home, school, labs.
            </div>
        </div>
        <div class="footnote" id="dynamicFact">➡️ Notice how slowly the liquid reacts to temperature changes (High thermal inertia).</div>
    </div>
</div>

<script src="index.js">
</script>
</body>
</html>

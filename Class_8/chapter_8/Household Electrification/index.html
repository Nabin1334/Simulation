<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Electrification </title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #444;
            pointer-events: none;
            user-select: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .status-item { margin: 10px 0; font-size: 14px; display: flex; justify-content: space-between; width: 200px; }
        .indicator { font-weight: bold; transition: color 0.3s; }
        .on { color: #00ff00; text-shadow: 0 0 10px #00ff00; }
        .off { color: #ff3333; }
        .instruction { font-size: 11px; color: #aaa; margin-top: 15px; border-top: 1px solid #333; pt: 10px;}
    </style>
</head>
<body>

<div id="ui-panel">
    <h2 style="margin: 0 0 15px 0; font-size: 18px; color: #00d2ff;">Electrical Lab v1.0</h2>
    <div class="status-item">Main MCB: <span id="mcb-status" class="indicator on">ON</span></div>
    <div class="status-item">Light Switch: <span id="light-status" class="indicator off">OFF</span></div>
    <div class="status-item">Fan Switch: <span id="fan-status" class="indicator off">OFF</span></div>
    <div class="instruction">
        • CLICK MCB or Switches to operate<br>
        • DRAG to rotate view<br>
        • SCROLL to zoom
    </div>
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // --- CONFIG & STATE ---
    const state = {
        mcbOn: true,
        lightOn: false,
        fanOn: false,
        fanVelocity: 0,
        lightIntensity: 0
    };

    // --- SCENE SETUP ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);
    scene.fog = new THREE.Fog(0x111111, 20, 100);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(-15, 5, 35);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ReinhardToneMapping;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // --- LIGHTING ---
    const ambient = new THREE.AmbientLight(0xffffff, 0.2);
    scene.add(ambient);

    const roomLight = new THREE.DirectionalLight(0xffffff, 0.5);
    roomLight.position.set(-10, 20, 20);
    roomLight.castShadow = true;
    scene.add(roomLight);

    // --- MATERIALS ---
    const matWall = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.8 });
    const matPlasticWhite = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2, metalness: 0.1 });
    const matPlasticGrey = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.4 });
    const matWireRed = new THREE.MeshStandardMaterial({ color: 0xcc0000, roughness: 0.5 });
    const matWireBlack = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5 });
    const matGlass = new THREE.MeshPhysicalMaterial({
        color: 0xffffff, transmission: 0.95, roughness: 0.05, thickness: 0.2, transparent: true
    });

    // --- MODELS ---

    // Wall
    const wall = new THREE.Mesh(new THREE.PlaneGeometry(100, 60), matWall);
    wall.position.z = -2;
    wall.receiveShadow = true;
    scene.add(wall);

    // 1. Meter Box
    const meter = new THREE.Group();
    meter.add(new THREE.Mesh(new THREE.BoxGeometry(4, 5, 1), matPlasticGrey));
    const screen = new THREE.Mesh(new THREE.PlaneGeometry(3, 1.5), new THREE.MeshBasicMaterial({color: 0x224422}));
    screen.position.set(0, 1, 0.51);
    const meterLed = new THREE.Mesh(new THREE.CircleGeometry(0.1, 16), new THREE.MeshBasicMaterial({color: 0xff0000}));
    meterLed.position.set(-1, -1, 0.51);
    meter.add(screen, meterLed);
    meter.position.set(-10, 10, 0);
    scene.add(meter);

    // 2. MCB Breaker
    const mcb = new THREE.Group();
    mcb.add(new THREE.Mesh(new THREE.BoxGeometry(2.5, 4, 1.2), matPlasticWhite));
    const mcbLever = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1, 0.8), matPlasticGrey);
    mcbLever.position.set(0, 0.5, 0.6);
    mcbLever.rotation.x = -Math.PI/4; // ON position
    mcbLever.name = "MCB";
    mcb.add(mcbLever);
    mcb.position.set(-10, 2, 0);
    scene.add(mcb);

    // 3. Switchboard
    const sb = new THREE.Group();
    sb.add(new THREE.Mesh(new THREE.BoxGeometry(10, 4, 0.6), matPlasticWhite));
    
    function createSwitch(x, name) {
        const sw = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2, 0.4), matPlasticWhite);
        sw.position.set(x, 0, 0.3);
        sw.rotation.x = -Math.PI/10; // OFF
        sw.name = name;
        sb.add(sw);
        return sw;
    }
    const swLight = createSwitch(-2, "SW_LIGHT");
    const swFan = createSwitch(1, "SW_FAN");
    sb.position.set(2, -4, 0);
    scene.add(sb);

    // 4. Hanging Bulb
    const bulbGroup = new THREE.Group();
    const glass = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), matGlass);
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.8), matPlasticGrey);
    cap.position.y = 1.2;
    const bulbLight = new THREE.PointLight(0xffaa44, 0, 30, 2);
    bulbLight.castShadow = true;
    bulbGroup.add(glass, cap, bulbLight);
    bulbGroup.position.set(0, 8, 3);
    scene.add(bulbGroup);

    // 5. Ceiling Fan
    const fanGroup = new THREE.Group();
    const motor = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 1, 32), matPlasticWhite);
    const blades = new THREE.Group();
    for(let i=0; i<3; i++) {
        const blade = new THREE.Mesh(new THREE.BoxGeometry(7, 0.1, 1.5), matPlasticWhite);
        blade.position.x = 4;
        const pivot = new THREE.Group();
        pivot.rotation.y = (i * Math.PI * 2) / 3;
        pivot.add(blade);
        blades.add(pivot);
    }
    fanGroup.add(motor, blades);
    fanGroup.rotation.x = Math.PI/2;
    fanGroup.position.set(12, 8, 2);
    scene.add(fanGroup);

    // --- WIRING (Visible 3D Tubes) ---
    function addWire(points, colorMat) {
        const curve = new THREE.CatmullRomCurve3(points);
        const geo = new THREE.TubeGeometry(curve, 40, 0.08, 8, false);
        scene.add(new THREE.Mesh(geo, colorMat));
    }

    // Wiring Logic Paths
    addWire([new THREE.Vector3(-18, 15, 5), new THREE.Vector3(-10, 12, 0)], matWireRed); // Input
    addWire([new THREE.Vector3(-10, 7.5, 0), new THREE.Vector3(-10, 4, 0)], matWireRed); // Meter to MCB
    addWire([new THREE.Vector3(-10, 0, 0), new THREE.Vector3(-10, -4, 0), new THREE.Vector3(-3, -4, 0)], matWireRed); // MCB to SB
    addWire([new THREE.Vector3(0, -2, 0), new THREE.Vector3(0, 10, 3)], matWireRed); // SB to Bulb

    // --- INTERACTION ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('mousedown', (e) => {
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(scene.children, true);
        
        if(intersects.length > 0) {
            const obj = intersects[0].object;
            if(obj.name === "MCB") {
                state.mcbOn = !state.mcbOn;
                obj.rotation.x = state.mcbOn ? -Math.PI/4 : Math.PI/4;
                document.getElementById('mcb-status').innerText = state.mcbOn ? "ON" : "OFF";
                document.getElementById('mcb-status').className = "indicator " + (state.mcbOn ? "on" : "off");
            }
            if(obj.name === "SW_LIGHT") {
                state.lightOn = !state.lightOn;
                obj.rotation.x = state.lightOn ? Math.PI/10 : -Math.PI/10;
                document.getElementById('light-status').innerText = state.lightOn ? "ON" : "OFF";
                document.getElementById('light-status').className = "indicator " + (state.lightOn ? "on" : "off");
            }
            if(obj.name === "SW_FAN") {
                state.fanOn = !state.fanOn;
                obj.rotation.x = state.fanOn ? Math.PI/10 : -Math.PI/10;
                document.getElementById('fan-status').innerText = state.fanOn ? "ON" : "OFF";
                document.getElementById('fan-status').className = "indicator " + (state.fanOn ? "on" : "off");
            }
        }
    });

    // --- ANIMATION LOOP ---
    function animate() {
        requestAnimationFrame(animate);
        
        const powerAvailable = state.mcbOn;

        // Fan Physics
        if(powerAvailable && state.fanOn) {
            state.fanVelocity = THREE.MathUtils.lerp(state.fanVelocity, 0.25, 0.01);
        } else {
            state.fanVelocity = THREE.MathUtils.lerp(state.fanVelocity, 0, 0.005);
        }
        blades.rotation.y += state.fanVelocity;

        // Bulb Physics
        const targetIntensity = (powerAvailable && state.lightOn) ? 1.5 : 0;
        state.lightIntensity = THREE.MathUtils.lerp(state.lightIntensity, targetIntensity, 0.1);
        bulbLight.intensity = state.lightIntensity * 40;
        glass.material.emissive = new THREE.Color(0xffaa44);
        glass.material.emissiveIntensity = state.lightIntensity;

        // Meter LED Blink
        if(powerAvailable) {
            meterLed.material.color.setHex(Math.sin(Date.now()*0.005) > 0 ? 0xff0000 : 0x330000);
        } else {
            meterLed.material.color.setHex(0x330000);
        }

        controls.update();
        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
